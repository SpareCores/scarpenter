# The ServiceAccount, SCarpenter's own permissions (SCNodeClasses, certificate
# approval, references, bootstrap tokens) and the node-join bindings are the
# production ones, config/rbac, which run.sh applies; this file adds what the
# lane needs besides them: Karpenter core's permissions and the fake driver's.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scarpenter-kwok
rules:
  # Karpenter core (derived from the AWS provider's chart, clusterrole-core).
  - apiGroups: ["karpenter.sh"]
    resources: ["nodepools", "nodepools/status", "nodeclaims", "nodeclaims/status", "nodeoverlays", "nodeoverlays/status"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
  - apiGroups: ["autoscaling.x-k8s.io"]
    resources: ["capacitybuffers", "capacitybuffers/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "persistentvolumes", "persistentvolumeclaims", "replicationcontrollers", "namespaces", "podtemplates", "events", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  # Nodes: core updates and deletes them; the fake driver creates them.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes", "volumeattachments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The fake driver's configuration and state.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scarpenter-kwok
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: scarpenter-kwok}
subjects:
  - {kind: ServiceAccount, name: scarpenter, namespace: scarpenter-system}
