# The Keeper requests of the committed test snapshot (test/data/sc-snapshot), as
# a query list of sc-keeper-go's cmd/sc-snapshot (format: package
# github.com/SpareCores/sc-keeper-go/snapshot). Refresh it with the manually
# triggered workflow .github/workflows/refresh-sc-snapshot.yml, or locally with
# `make snapshot` and a Keeper API key (KEEPER_API_KEY or KEEPER_API_KEY_FILE;
# see docs/how-to-guides/testing.md).
#
# What it holds (plan 13): the files of Keeper's snapshot of one database hash,
# as the gzip bytes Keeper sent, the way the catalog reads them:
#   - for every vendor the six per-vendor tables the catalog reads;
#   - the global vendor table (billing facts);
#   - the score files of the test benchmarks for every vendor, every config of
#     a benchmark in one file;
# and /benchmark_configs, the one live route besides /healthcheck.
vendors:
  - {name: aws}
  - {name: gcp}
  - {name: azure}
  - {name: alicloud}
  - {name: hcloud}
  - {name: ovh}
  - {name: upcloud}
  - {name: vultr}

snapshot:
  vendors: [region, zone, server, server_price, storage_price, ipv4_price]
  global: [vendor]
  benchmarks: ["geekbench:score", "stress_ng:bestn", "membench:latency"]

queries:
  - {name: benchmark_configs, path: /benchmark_configs}
