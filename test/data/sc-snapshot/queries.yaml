vendorQueries:
  # Scores of the whole vendor, no regions (metrics and percentiles).
  - name: "{vendor}/benchmark-all-{benchmark_slug}"
    path: /servers
    benchmarks: true
    params:
      vendor: "{vendor}"
      limit: -1
      best_price_allocation: ONDEMAND_ONLY
      benchmark_id: "{benchmark_id}"
      benchmark_config: "{benchmark_config}"
  # The same for the vendor's test region (selection profiles).
  - name: "{vendor}/benchmark-{benchmark_slug}"
    path: /servers
    benchmarks: true
    params:
      vendor: "{vendor}"
      vendor_regions: "{vendor}~{region_id}"
      limit: -1
      best_price_allocation: ONDEMAND_ONLY
      benchmark_id: "{benchmark_id}"
      benchmark_config: "{benchmark_config}"
