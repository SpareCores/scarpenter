  - {name: aws/server-prices/ap-northeast-2, path: /server_prices, params: {vendor: aws, vendor_regions: ["aws~ap-northeast-2"], currency: USD, limit: -1}}
  - {name: aws/server-prices/ap-northeast-3, path: /server_prices, params: {vendor: aws, vendor_regions: ["aws~ap-northeast-3"], currency: USD, limit: -1}}
  - {name: aws/server-prices/ap-south-1, path: /server_prices, params: {vendor: aws, vendor_regions: ["aws~ap-south-1"], currency: USD, limit: -1}}
  - {name: aws/server-prices/ap-south-2, path: /server_prices, params: {vendor: aws, vendor_regions: ["aws~ap-south-2"], currency: USD, limit: -1}}
  - {name: aws/server-prices/ap-southeast-1, path: /server_prices, params: {vendor: aws, vendor_regions: ["aws~ap-southeast-1"], currency: USD, limit: -1}}
  - {name: aws/server-prices/ap-southeast-2, path: /server_prices, params: {vendor: aws, vendor_regions: ["aws~ap-southeast-2"], currency: USD, limit: -1}}
  - {name: aws/server-prices/ap-southeast-3, path: /server_prices, params: {vendor: aws, vendor_regions: ["aws~ap-southeast-3"], currency: USD, limit: -1}}
  - {name: aws/server-prices/ap-southeast-4, path: /server_prices, params: {vendor: aws, vendor_regions: ["aws~ap-southeast-4"], currency: USD, limit: -1}}
  - {name: aws/server-prices/ap-southeast-5, path: /server_prices, params: {vendor: aws, vendor_regions: ["aws~ap-southeast-5"], currency: USD, limit: -1}}
  - {name: aws/server-prices/ap-southeast-6, path: /server_prices, params: {vendor: aws, vendor_regions: ["aws~ap-southeast-6"], currency: USD, limit: -1}}
  - {name: aws/server-prices/ap-southeast-7, path: /server_prices, params: {vendor: aws, vendor_regions: ["aws~ap-southeast-7"], currency: USD, limit: -1}}
  - {name: aws/server-prices/ca-central-1, path: /server_prices, params: {vendor: aws, vendor_regions: ["aws~ca-central-1"], currency: USD, limit: -1}}
  - {name: aws/server-prices/ca-west-1, path: /server_prices, params: {vendor: aws, vendor_regions: ["aws~ca-west-1"], currency: USD, limit: -1}}
  - {name: aws/server-prices/eu-central-1, path: /server_prices, params: {vendor: aws, vendor_regions: ["aws~eu-central-1"], currency: USD, limit: -1}}
  - {name: aws/server-prices/eu-central-2, path: /server_prices, params: {vendor: aws, vendor_regions: ["aws~eu-central-2"], currency: USD, limit: -1}}
