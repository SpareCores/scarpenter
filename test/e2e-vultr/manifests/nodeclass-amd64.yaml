# The NodeClass of the amd64 scenarios (plan 20, section 9): the tailscale template with
# pinned versions, no private network (isolation none, so no VPC), the managed firewall
# group of the region with a short idle lifetime (the uninstall scenario sees it go), the
# Flatcar snapshot found by its description. The snapshot of the pinned release must exist in
# the account (the preflight checks).
#
# It must exist before the controller starts: the label keys of a NodeClass's metrics are
# registered with Karpenter core at start-up (install.sh applies it before the chart).
apiVersion: scarpenter.sparecores.com/v1alpha1
kind: SCNodeClass
metadata:
  name: e2e-amd64
spec:
  flatcar: {channel: ${E2E_FLATCAR_CHANNEL}, version: "${E2E_FLATCAR_VERSION}"}
  kubernetes: {version: "${E2E_KUBERNETES_VERSION}"}
  network:
    template: tailscale
    tailscale:
      version: "${E2E_TAILSCALE_VERSION}"
      # The auth key Secret of install.sh: minted through the Tailscale API,
      # ephemeral, pre-authorized, reusable, tagged, valid for an hour.
      authKeySecretRef: {name: ts-node-key, namespace: scarpenter-system, key: authkey}
      tags: ["${E2E_TAG_NODE}"]
  # The creation time on every instance of the run (the sweeper's age check for what has
  # no creation time of its own is the API's; this one is for the reader).
  tags: {ci-created-at: "${E2E_CREATED_AT}", ci-run: "${E2E_RUN_ID}"}
  networking: {isolation: none}
  vendors:
    vultr:
      regions: [${VULTR_REGION}]
      resources:
        firewallGroups: {create: {lifecycle: {policy: idleTTL, ttl: 5m}}}
