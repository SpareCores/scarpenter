# Scenario negative: NodeClasses Vultr cannot serve. They are used by no NodePool except
# e2e-profile's, so nothing is launched.
#   e2e-noipv4   publicIPv4: false: refused (a node without a public address needs a NAT
#                gateway, which v1 does not manage): the NodeClass is not VendorReady.
#   e2e-profile  a storage profile with a vultr block: Vultr has no storage features in v1, so
#                the offerings that select the profile are unavailable.
apiVersion: scarpenter.sparecores.com/v1alpha1
kind: SCNodeClass
metadata:
  name: e2e-noipv4
spec:
  flatcar: {channel: ${E2E_FLATCAR_CHANNEL}, version: "${E2E_FLATCAR_VERSION}"}
  kubernetes: {version: "${E2E_KUBERNETES_VERSION}"}
  network:
    template: tailscale
    tailscale:
      version: "${E2E_TAILSCALE_VERSION}"
      # The auth key Secret of install.sh: minted through the Tailscale API,
      # ephemeral, pre-authorized, reusable, tagged, valid for an hour.
      authKeySecretRef: {name: ts-node-key, namespace: scarpenter-system, key: authkey}
      tags: ["${E2E_TAG_NODE}"]
  # The creation time on every instance of the run (the sweeper's age check for what has
  # no creation time of its own is the API's; this one is for the reader).
  tags: {ci-created-at: "${E2E_CREATED_AT}", ci-run: "${E2E_RUN_ID}"}
  networking: {isolation: none, publicIPv4: false}
  vendors:
    vultr:
      regions: [${VULTR_REGION}]
---
apiVersion: scarpenter.sparecores.com/v1alpha1
kind: SCNodeClass
metadata:
  name: e2e-profile
spec:
  flatcar: {channel: ${E2E_FLATCAR_CHANNEL}, version: "${E2E_FLATCAR_VERSION}"}
  kubernetes: {version: "${E2E_KUBERNETES_VERSION}"}
  network:
    template: tailscale
    tailscale:
      version: "${E2E_TAILSCALE_VERSION}"
      # The auth key Secret of install.sh: minted through the Tailscale API,
      # ephemeral, pre-authorized, reusable, tagged, valid for an hour.
      authKeySecretRef: {name: ts-node-key, namespace: scarpenter-system, key: authkey}
      tags: ["${E2E_TAG_NODE}"]
  # The creation time on every instance of the run (the sweeper's age check for what has
  # no creation time of its own is the API's; this one is for the reader).
  tags: {ci-created-at: "${E2E_CREATED_AT}", ci-run: "${E2E_RUN_ID}"}
  networking: {isolation: none}
  profiles:
    storage:
      data: {vultr: {}}
  vendors:
    vultr:
      regions: [${VULTR_REGION}]
