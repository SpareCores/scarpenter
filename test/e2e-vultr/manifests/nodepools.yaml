# The NodePools of the lane. Consolidation is WhenEmpty with 0 s, so an empty node goes at
# once (the scale-to-zero exit criterion); limits keep a runaway small; every pool lists
# the plans it may launch, and the workloads select their pool, so that two pools with the
# same plan never compete. The account's own limits (maximum instances and cost) are the
# ceiling: Vultr credentials cannot deny plans or regions.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: e2e-amd64
spec:
  template:
    spec:
      nodeClassRef: {group: scarpenter.sparecores.com, kind: SCNodeClass, name: e2e-amd64}
      requirements:
        - {key: scarpenter.sparecores.com/vendor, operator: In, values: [vultr]}
        - {key: kubernetes.io/arch, operator: In, values: [amd64]}
        - {key: karpenter.sh/capacity-type, operator: In, values: [on-demand]}
        - {key: node.kubernetes.io/instance-type, operator: In, values: ["${E2E_TYPE_AMD64}"]}
  disruption: {consolidationPolicy: WhenEmpty, consolidateAfter: 0s}
  limits: {cpu: "4"}
---
