# The described-not-named pool: the NodeClass of the amd64 pool, three sizes of one family.
# The workload narrows it with vcpus and memory.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: e2e-described
spec:
  template:
    spec:
      nodeClassRef: {group: scarpenter.sparecores.com, kind: SCNodeClass, name: e2e-amd64}
      requirements:
        - {key: scarpenter.sparecores.com/vendor, operator: In, values: [vultr]}
        - {key: kubernetes.io/arch, operator: In, values: [amd64]}
        - {key: karpenter.sh/capacity-type, operator: In, values: [on-demand]}
        - {key: node.kubernetes.io/instance-type, operator: In, values: [${E2E_TYPES_DESCRIBED_YAML}]}
  disruption: {consolidationPolicy: WhenEmpty, consolidateAfter: 0s}
  limits: {cpu: "4"}
---
# The negative pools (scenario negative): Vultr has no Arm instances, so no offering
# matches the first; the second selects a storage profile Vultr cannot honour.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: e2e-arm64
spec:
  template:
    spec:
      nodeClassRef: {group: scarpenter.sparecores.com, kind: SCNodeClass, name: e2e-amd64}
