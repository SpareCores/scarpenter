# The workload of the arm64 scenario: a one-replica Deployment pinned to the arm64 NodePool, whose
# types are A1 and A2: it takes whichever launches (scenarios.sh: start_arm64). It logs a line
# (kubectl logs) and sleeps (kubectl exec); no grace period, so that deleting it does not hold the
# node. Public ECR mirror of busybox (a multi-architecture image).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${NAME}
  labels: {app: ${NAME}, scarpenter-e2e: "true"}
spec:
  replicas: 1
  selector:
    matchLabels: {app: ${NAME}}
  template:
    metadata:
      labels: {app: ${NAME}, scarpenter-e2e: "true"}
    spec:
      terminationGracePeriodSeconds: 0
      nodeSelector:
        karpenter.sh/nodepool: ${POOL}
        kubernetes.io/arch: arm64
      containers:
        - name: probe
          image: public.ecr.aws/docker/library/busybox:1.37.0
          command: [sh, -c, "echo scarpenter-e2e-up; exec sleep 86400"]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
