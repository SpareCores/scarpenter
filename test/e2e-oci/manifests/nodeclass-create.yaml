# The NodeClass of the create scenario: no `use` anywhere, the managed VCN (an internet gateway, a
# route table, a minimal security list and one regional public subnet) and the NodeClass's network
# security group are created by SCarpenter (named scarpenter-<cluster>-..., tagged with the
# ownership marker), used by the node and deleted by their lifecycle once the NodeClass is gone (a
# short idle lifetime).
apiVersion: scarpenter.sparecores.com/v1alpha1
kind: SCNodeClass
metadata:
  name: e2e-create
spec:
  flatcar: {channel: ${E2E_FLATCAR_CHANNEL}, version: "${E2E_FLATCAR_VERSION}"}
  kubernetes: {version: "${E2E_KUBERNETES_VERSION}"}
  network:
    template: tailscale
    tailscale:
      version: "${E2E_TAILSCALE_VERSION}"
      # The auth key Secret of install.sh: minted through the Tailscale API,
      # ephemeral, pre-authorized, reusable, tagged, valid for an hour.
      authKeySecretRef: {name: ts-node-key, namespace: scarpenter-system, key: authkey}
      tags: ["${E2E_TAG_NODE}"]
  # The creation time and the run on every instance of the run (freeform tags), which the
  # sweeper reads (a tag key and value: letters, digits, - and _).
  tags: {ci-created-at: "${E2E_CREATED_AT}", ci-run: "${E2E_RUN_ID}"}
  vendors:
    oci:
      regions: [${OCI_REGION}]
      storage:
        root: {sizeGb: ${E2E_ROOT_GB}, performance: balanced}
      resources:
        subnets: {create: {lifecycle: {policy: idleTTL, ttl: 3m}}}
        networkSecurityGroups: {create: {lifecycle: {policy: idleTTL, ttl: 3m}}}
