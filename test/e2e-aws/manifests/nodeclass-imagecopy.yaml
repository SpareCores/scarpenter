# The NodeClass of the manual imagecopy scenario (plan 29 step 4): limited to a region that has no
# Flatcar AMI of its own (E2E_COPY_REGION), so that the first launch there makes the controller
# copy the image. The tailscale template and the tags as in the other NodeClasses.
apiVersion: scarpenter.sparecores.com/v1alpha1
kind: SCNodeClass
metadata:
  name: e2e-imagecopy
spec:
  flatcar: {channel: ${E2E_FLATCAR_CHANNEL}, version: "${E2E_FLATCAR_VERSION}"}
  kubernetes: {version: "${E2E_KUBERNETES_VERSION}"}
  network:
    template: tailscale
    tailscale:
      version: "${E2E_TAILSCALE_VERSION}"
      authKeySecretRef: {name: ts-node-key, namespace: scarpenter-system, key: authkey}
      tags: ["${E2E_TAG_NODE}"]
  tags: {ci-created-at: "${E2E_CREATED_AT}", ci-run: "${E2E_RUN_ID}"}
  vendors:
    aws:
      regions: [${E2E_COPY_REGION}]
      storage:
        root: {volumeType: gp3, volumeSize: 20Gi}
      resources:
        securityGroups: {create: {lifecycle: {policy: idleTTL, ttl: 5m}}}
