# The workload of the manual interruption scenario: one spot Pod of the arm64 pool that
# writes a line with the time (epoch seconds) when it gets SIGTERM, and keeps running
# for the rest of its grace period, so that the scenario can read the line from its log
# (plan 26: the Pod must get SIGTERM before the vendor's deadline). The grace period
# is longer than the first workload's, to keep the Pod's log readable (the scenario follows it).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-intr
  labels: {app: e2e-intr, scarpenter-e2e: "true"}
spec:
  replicas: 1
  selector:
    matchLabels: {app: e2e-intr}
  template:
    metadata:
      labels: {app: e2e-intr, scarpenter-e2e: "true"}
    spec:
      # Never on the node of the arm64 scenario's Pod (the same pool): the interruption must
      # hit a node of its own.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: {app: e2e-arm64}
      terminationGracePeriodSeconds: 45
      nodeSelector:
        karpenter.sh/nodepool: e2e-arm64
        node.kubernetes.io/instance-type: ${E2E_TYPE_ARM64}
        karpenter.sh/capacity-type: spot
      containers:
        - name: probe
          image: public.ecr.aws/docker/library/busybox:1.37.0
          command:
            - sh
            - -c
            - |
              trap 'echo "sigterm $(date +%s)"; sleep 40; exit 0' TERM
              echo scarpenter-e2e-up
              while :; do sleep 1; done
          resources:
            requests: {cpu: 100m, memory: 64Mi}
