# The pool of the manual imagecopy scenario: the one small amd64 on-demand type (E2E_COPY_TYPE).
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: e2e-imagecopy
spec:
  template:
    spec:
      nodeClassRef: {group: scarpenter.sparecores.com, kind: SCNodeClass, name: e2e-imagecopy}
      requirements:
        - {key: scarpenter.sparecores.com/vendor, operator: In, values: [aws]}
        - {key: kubernetes.io/arch, operator: In, values: [amd64]}
        - {key: karpenter.sh/capacity-type, operator: In, values: [on-demand]}
        - {key: node.kubernetes.io/instance-type, operator: In, values: ["${E2E_COPY_TYPE}"]}
  disruption: {consolidationPolicy: WhenEmpty, consolidateAfter: 0s}
  limits: {cpu: "2"}
