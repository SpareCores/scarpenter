# The NodeClass of the amd64 scenarios (docs/plans/v1/done/10-aws-e2e.md): the
# tailscale template with pinned versions, a small gp3 root volume, a storage
# profile with a small io2 data volume (low IOPS, to keep the cost down), the
# placement profile that puts a database and its client into one cluster placement
# group, and a benchmark metric for the described-not-named scenario.
#
# It must exist before the controller starts: the label keys of a NodeClass's
# metrics are registered with Karpenter core at start-up (install.sh applies it
# before the chart).
apiVersion: scarpenter.sparecores.com/v1alpha1
kind: SCNodeClass
metadata:
  name: e2e-amd64
spec:
  flatcar: {channel: ${E2E_FLATCAR_CHANNEL}, version: "${E2E_FLATCAR_VERSION}"}
  kubernetes: {version: "${E2E_KUBERNETES_VERSION}"}
  network:
    template: tailscale
    tailscale:
      version: "${E2E_TAILSCALE_VERSION}"
      # The auth key Secret of install.sh: minted through the Tailscale API,
      # ephemeral, pre-authorized, reusable, tagged, valid for an hour.
      authKeySecretRef: {name: ts-node-key, namespace: scarpenter-system, key: authkey}
      tags: ["${E2E_TAG_NODE}"]
  # The creation time on every resource of the run, which the sweeper needs: a
  # security group or a VPC has no creation time of its own in the API.
  tags: {ci-created-at: "${E2E_CREATED_AT}", ci-run: "${E2E_RUN_ID}"}
  metrics:
    single-core:
      benchmark: {id: "geekbench:score", config: {cores: single}}
  profiles:
    storage:
      db-io2:
        aws:
          data:
            - {name: pgdata, volumeType: io2, volumeSize: 4Gi, iops: 100, filesystem: xfs, mountPath: /var/lib/pgdata}
    placement:
      colocated: {aws: {placementGroup: {strategy: cluster}}}
  vendors:
    aws:
      regions: [${AWS_REGION}]
      storage:
        root: {volumeType: gp3, volumeSize: 20Gi}
      # A short idle lifetime, so that the uninstall scenario sees the NodeClass's
      # security group go (the default is 24 hours).
      resources:
        securityGroups: {create: {lifecycle: {policy: idleTTL, ttl: 5m}}}
