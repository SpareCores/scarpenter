apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default-aws
  labels:
    helm.sh/chart: scarpenter-0.0.0-dev
    app.kubernetes.io/name: scarpenter
    app.kubernetes.io/instance: scarpenter
    app.kubernetes.io/version: "dev"
    app.kubernetes.io/managed-by: Helm
  annotations:
    helm.sh/resource-policy: keep
spec:
  template:
    spec:
      nodeClassRef: {group: scarpenter.sparecores.com, kind: SCNodeClass, name: default-aws}
      requirements:
        - {key: scarpenter.sparecores.com/vendor, operator: In, values: [aws]}
        - {key: karpenter.sh/capacity-type, operator: In, values: [spot, on-demand]}
        - {key: kubernetes.io/arch, operator: In, values: [amd64]}
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
  limits:
    cpu: "100"

