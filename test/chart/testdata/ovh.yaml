---
# Source: scarpenter/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scarpenter
  namespace: scarpenter-system
  labels:
    helm.sh/chart: scarpenter-0.0.0-dev
    app.kubernetes.io/name: scarpenter
    app.kubernetes.io/instance: scarpenter
    app.kubernetes.io/version: "dev"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scarpenter
      app.kubernetes.io/instance: scarpenter
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: controller
        # Core must never voluntarily disrupt the node that hosts its own controller.
        karpenter.sh/do-not-disrupt: "true"
      labels:
        helm.sh/chart: scarpenter-0.0.0-dev
        app.kubernetes.io/name: scarpenter
        app.kubernetes.io/instance: scarpenter
        app.kubernetes.io/version: "dev"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: scarpenter
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: controller
          image: "ghcr.io/sparecores/scarpenter:dev"
          imagePullPolicy: IfNotPresent
          args:
            - "--api-server-endpoint=https://100.64.0.1:6443"
            - "--cluster-dns=10.43.0.10"
            - "--cluster-name=lab"
            - "--health-probe-port=8081"
            - "--keeper-cache-dir=/var/cache/scarpenter/keeper"
            - "--kubelet-client-ca-file=/etc/scarpenter/kubelet-client-ca/client-ca.crt"
            - "--metrics-port=8080"
            - "--vendors=aws,ovh"
          env:
            # Where kube-root-ca.crt is read, where events about the controller
            # go and where core keeps its leader election lease.
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: LEADER_ELECTION_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            # Not core's default: another Karpenter in the same namespace would
            # share the lease karpenter-leader-election and only one would run.
            - name: LEADER_ELECTION_NAME
              value: "scarpenter-leader-election"
            # The Deployment the garbage collector's Events are attached to when
            # an orphan has no NodeClass.
            - name: SCARPENTER_DEPLOYMENT_NAME
              value: "scarpenter"
            # Core sizes its garbage collector and its concurrency from these.
            - name: MEMORY_LIMIT
              valueFrom: {resourceFieldRef: {containerName: controller, resource: limits.memory, divisor: "1"}}
            - name: CPU_REQUESTS
              valueFrom: {resourceFieldRef: {containerName: controller, resource: requests.cpu, divisor: 1m}}
            - name: AWS_REGION
              value: "us-east-1"
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: "aws-keys", key: "AWS_ACCESS_KEY_ID"}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: "aws-keys", key: "AWS_SECRET_ACCESS_KEY"}}
            - name: SCARPENTER_OVH_SCHEDULE_WAIT
              value: "30s"
            - name: SCARPENTER_OVH_REGION_ALIASES
              value: "GRA11=GRA11-NEW,SBG5="
            - name: OS_AUTH_URL
              valueFrom: {secretKeyRef: {name: "ovh-openstack", key: "OS_AUTH_URL"}}
            - name: OS_PASSWORD
              valueFrom: {secretKeyRef: {name: "ovh-openstack", key: "OS_PASSWORD"}}
            - name: OS_PROJECT_ID
              valueFrom: {secretKeyRef: {name: "ovh-openstack", key: "project"}}
            - name: OS_USERNAME
              valueFrom: {secretKeyRef: {name: "ovh-openstack", key: "OS_USERNAME"}}
            - name: OS_USER_DOMAIN_NAME
              valueFrom: {secretKeyRef: {name: "ovh-openstack", key: "OS_USER_DOMAIN_NAME"}}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 200m
              memory: 640Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kubelet-client-ca
              mountPath: /etc/scarpenter/kubelet-client-ca
              readOnly: true
            - name: keeper-cache
              mountPath: /var/cache/scarpenter/keeper
      volumes:
        - name: tmp
          emptyDir: {}
        - name: kubelet-client-ca
          configMap:
            name: "k3s-client-ca"
            items:
              - {key: "client-ca.crt", path: "client-ca.crt"}
        - name: keeper-cache
          emptyDir:
            sizeLimit: "256Mi"
      nodeSelector:
        kubernetes.io/os: linux
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: karpenter.sh/nodepool
                operator: DoesNotExist
            weight: 100

