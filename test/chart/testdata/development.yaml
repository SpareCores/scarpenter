---
# Source: scarpenter/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scarpenter
  namespace: scarpenter-system
  labels:
    helm.sh/chart: scarpenter-0.0.0-dev
    app.kubernetes.io/name: scarpenter
    app.kubernetes.io/instance: scarpenter
    app.kubernetes.io/version: "dev"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scarpenter
      app.kubernetes.io/instance: scarpenter
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: controller
        # Core must never voluntarily disrupt the node that hosts its own controller.
        karpenter.sh/do-not-disrupt: "true"
      labels:
        helm.sh/chart: scarpenter-0.0.0-dev
        app.kubernetes.io/name: scarpenter
        app.kubernetes.io/instance: scarpenter
        app.kubernetes.io/version: "dev"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: scarpenter
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: controller
          image: "ghcr.io/sparecores/scarpenter-dev:dev"
          imagePullPolicy: IfNotPresent
          args:
            - "--api-server-endpoint=https://kubernetes.default.svc"
            - "--cluster-dns=10.96.0.10"
            - "--cluster-name=scarpenter-kwok"
            - "--health-probe-port=8081"
            - "--log-level=debug"
            - "--metrics-port=8080"
            - "--vendors=fake"
          env:
            # Where kube-root-ca.crt is read, where events about the controller
            # go and where core keeps its leader election lease.
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: LEADER_ELECTION_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            # Not core's default: another Karpenter in the same namespace would
            # share the lease karpenter-leader-election and only one would run.
            - name: LEADER_ELECTION_NAME
              value: "scarpenter-leader-election"
            # The Deployment the garbage collector's Events are attached to when
            # an orphan has no NodeClass.
            - name: SCARPENTER_DEPLOYMENT_NAME
              value: "scarpenter"
            # Core sizes its garbage collector and its concurrency from these.
            - name: MEMORY_LIMIT
              valueFrom: {resourceFieldRef: {containerName: controller, resource: limits.memory, divisor: "1"}}
            - name: CPU_REQUESTS
              valueFrom: {resourceFieldRef: {containerName: controller, resource: requests.cpu, divisor: 1m}}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 200m
              memory: 640Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      nodeSelector:
        kubernetes.io/os: linux
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: karpenter.sh/nodepool
                operator: DoesNotExist
            weight: 100
