# The cluster runs the NVIDIA GPU operator: no device plugin (the RuntimeClass is off by default).
cluster:
  name: my-cluster
  apiServerEndpoint: https://api.example.com:6443
  dns: [10.96.0.10]
vendors:
  aws:
    credentials:
      webIdentity:
        roleArn: arn:aws:iam::123456789012:role/scarpenter-my-cluster
nvidia:
  devicePlugin: {enabled: false}
