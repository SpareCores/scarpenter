---
# Source: scarpenter/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scarpenter
  namespace: scarpenter-system
  labels:
    helm.sh/chart: scarpenter-0.0.0-dev
    app.kubernetes.io/name: scarpenter
    app.kubernetes.io/instance: scarpenter
    app.kubernetes.io/version: "dev"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: scarpenter
      app.kubernetes.io/instance: scarpenter
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: controller
        # Core must never voluntarily disrupt the node that hosts its own controller.
        karpenter.sh/do-not-disrupt: "true"
        example.com/note: full
      labels:
        helm.sh/chart: scarpenter-0.0.0-dev
        app.kubernetes.io/name: scarpenter
        app.kubernetes.io/instance: scarpenter
        app.kubernetes.io/version: "dev"
        app.kubernetes.io/managed-by: Helm
        tier: control
    spec:
      imagePullSecrets:
        - name: pull-secret
      serviceAccountName: scarpenter
      automountServiceAccountToken: true
      priorityClassName: "system-cluster-critical"
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: controller
          image: "registry.example.com/scarpenter@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          imagePullPolicy: Always
          args:
            - "--api-server-endpoint=https://api.example.com:6443"
            - "--aws-home-region=eu-central-1"
            - "--batch-idle-duration=2s"
            - "--batch-max-duration=20s"
            - "--billing-retention=false"
            - "--bootstrap-token-ttl=45m"
            - "--catalog-max-age=12h"
            - "--catalog-refresh-interval=30m"
            - "--cluster-ca-file=/etc/scarpenter/cluster-ca/ca.pem"
            - "--cluster-dns=10.96.0.10,fd00::10"
            - "--cluster-domain=cluster.example"
            - "--cluster-name=prod_1"
            - "--feature-gates=NodeRepair=true"
            - "--flatcar-base-url=https://mirror.example.com/flatcar/{channel}"
            - "--gc-dry-run=true"
            - "--gc-grace-period=10m"
            - "--gc-interval=3m"
            - "--health-probe-port=9091"
            - "--keeper-api-key-file=/etc/scarpenter/keeper/api-key"
            - "--keeper-cache-dir=/var/cache/scarpenter/keeper"
            - "--keeper-url=https://keeper.example.com"
            - "--kubelet-client-ca-file=/etc/scarpenter/kubelet-client-ca/client-ca.crt"
            - "--log-level=debug"
            - "--max-launch-attempts=5"
            - "--metrics-port=9090"
            - "--quota-launchable-refresh-interval=2h"
            - "--quota-limits-refresh-interval=20m"
            - "--quota-max-staleness=30m"
            - "--quota-refresh-interval=90s"
            - "--resource-check-interval=45s"
            - "--resource-default-ttl=48h"
            - "--resource-full-sweep-every=20"
            - "--resource-per-use-grace=3m"
            - "--sysext-base-url=https://mirror.example.com/sysext"
            - "--tailnet-prefixes=100.64.0.0/10,10.1.0.0/16"
            - "--terminating-grace=15m"
            - "--unavailable-insufficient-capacity-ttl=4m"
            - "--unavailable-quota-exceeded-ttl=1h"
            - "--unavailable-unsupported-ttl=12h"
            - "--unavailable-zone-unusable-ttl=15m"
            - "--vendors=aws"
            - "--enable-profiling"
          env:
            # Where kube-root-ca.crt is read, where events about the controller
            # go and where core keeps its leader election lease.
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: LEADER_ELECTION_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            # Not core's default: another Karpenter in the same namespace would
            # share the lease karpenter-leader-election and only one would run.
            - name: LEADER_ELECTION_NAME
              value: "scarpenter-leader-election"
            # The Deployment the garbage collector's Events are attached to when
            # an orphan has no NodeClass.
            - name: SCARPENTER_DEPLOYMENT_NAME
              value: "scarpenter"
            # Core sizes its garbage collector and its concurrency from these.
            - name: MEMORY_LIMIT
              valueFrom: {resourceFieldRef: {containerName: controller, resource: limits.memory, divisor: "1"}}
            - name: CPU_REQUESTS
              valueFrom: {resourceFieldRef: {containerName: controller, resource: requests.cpu, divisor: 1m}}
            - name: AWS_REGION
              value: "eu-west-1"
            - name: SCARPENTER_AWS_IPV4_PRICE
              value: "0.0036"
            - name: AWS_ROLE_ARN
              value: "arn:aws:iam::123456789012:role/scarpenter-prod"
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/aws/token
            - name: AWS_ROLE_SESSION_NAME
              value: "scarpenter"
            - name: HTTPS_PROXY
              value: http://proxy.example.com:3128
          ports:
            - name: health
              containerPort: 9091
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: aws-token
              mountPath: /var/run/secrets/aws
              readOnly: true
            - name: cluster-ca
              mountPath: /etc/scarpenter/cluster-ca
              readOnly: true
            - name: kubelet-client-ca
              mountPath: /etc/scarpenter/kubelet-client-ca
              readOnly: true
            - name: keeper-api-key
              mountPath: /etc/scarpenter/keeper
              readOnly: true
            - name: keeper-cache
              mountPath: /var/cache/scarpenter/keeper
      volumes:
        - name: tmp
          emptyDir: {}
        - name: aws-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: "sts.example.com"
                  expirationSeconds: 7200
                  path: token
        - name: cluster-ca
          configMap:
            name: "cluster-ca"
            items:
              - {key: "ca.pem", path: "ca.pem"}
        - name: kubelet-client-ca
          configMap:
            name: "scarpenter-kubelet-client-ca"
            items:
              - {key: "client-ca.crt", path: "client-ca.crt"}
        - name: keeper-cache
          emptyDir:
            sizeLimit: "512Mi"
        - name: keeper-api-key
          secret:
            secretName: "keeper-key"
            items:
              - {key: "token", path: api-key}
      nodeSelector:
        kubernetes.io/os: linux
        node-group: system
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: karpenter.sh/nodepool
                operator: DoesNotExist
            weight: 100
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists

