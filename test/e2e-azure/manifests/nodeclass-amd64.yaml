# The NodeClass of the amd64 scenarios (docs/plans/v1/wip/17-azure.md section 9): the
# tailscale template with pinned versions, a small Premium root disk, a storage profile
# with a small Premium data disk (device /dev/disk/azure/scsi1/lun0), the placement
# profile that puts a database and its client into one proximity placement group, and a
# benchmark metric for the described-not-named scenario.
#
# The lane's resource group is brought (use: the CI role is scoped to it and cannot make
# resource groups); the VNet, subnet and NSG are made by SCarpenter inside it and go with
# the NodeClass after a short idle lifetime, so that the uninstall scenario sees them go.
#
# It must exist before the controller starts: the label keys of a NodeClass's
# metrics are registered with Karpenter core at start-up (install.sh applies it
# before the chart).
apiVersion: scarpenter.sparecores.com/v1alpha1
kind: SCNodeClass
metadata:
  name: e2e-amd64
spec:
  flatcar: {channel: ${E2E_FLATCAR_CHANNEL}, version: "${E2E_FLATCAR_VERSION}"}
  kubernetes: {version: "${E2E_KUBERNETES_VERSION}"}
  network:
    template: tailscale
    tailscale:
      version: "${E2E_TAILSCALE_VERSION}"
      # The auth key Secret of install.sh: minted through the Tailscale API,
      # ephemeral, pre-authorized, reusable, tagged, valid for an hour.
      authKeySecretRef: {name: ts-node-key, namespace: scarpenter-system, key: authkey}
      tags: ["${E2E_TAG_NODE}"]
  # The creation time on every resource of the run, which the sweeper needs (the tag name
  # is test/e2e-azure's created_tag).
  tags: {scarpenter-ci-created-at: "${E2E_CREATED_AT_RFC3339}", scarpenter-ci-run: "${E2E_RUN_ID}"}
  metrics:
    single-core:
      benchmark: {id: "geekbench:score", config: {cores: single}}
  profiles:
    storage:
      db-premium:
        azure:
          data:
            - {name: pgdata, storageAccountType: Premium_LRS, diskSizeGB: 4, filesystem: xfs, mountPath: /var/lib/pgdata}
    placement:
      colocated: {azure: {proximityPlacementGroup: {strategy: cluster}}}
  vendors:
    azure:
      regions: [${AZURE_REGION}]
      # The guard: the controller's subscription must be this one.
      subscriptionID: ${AZURE_SUBSCRIPTION_ID}
      storage:
        root: {storageAccountType: Premium_LRS, diskSizeGB: 32}
      resources:
        resourceGroups: {use: {ids: {${AZURE_REGION}: ["${AZURE_RESOURCE_GROUP}"]}}}
        subnets: {create: {lifecycle: {policy: idleTTL, ttl: 5m}}}
        securityGroups: {create: {lifecycle: {policy: idleTTL, ttl: 5m}}}
