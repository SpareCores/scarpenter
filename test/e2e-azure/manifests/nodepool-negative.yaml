# The pools of the negative scenario: nothing may be launched for them.
#   e2e-neg-spot    Spot on a B-series size (no Spot there: no offering, so no NodeClaim);
#   e2e-neg-denied  a size outside the Azure Policy's allow-list (E2E_TYPE_DENIED): the
#                   catalog may offer it, and then the policy refuses the VM; either way
#                   no VM of that size may exist.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: e2e-neg-spot
spec:
  template:
    spec:
      nodeClassRef: {group: scarpenter.sparecores.com, kind: SCNodeClass, name: e2e-arm64}
      requirements:
        - {key: scarpenter.sparecores.com/vendor, operator: In, values: [azure]}
        - {key: karpenter.sh/capacity-type, operator: In, values: [spot]}
        - {key: node.kubernetes.io/instance-type, operator: In, values: ["${E2E_TYPE_AMD64}"]}
  disruption: {consolidationPolicy: WhenEmpty, consolidateAfter: 0s}
  limits: {cpu: "2"}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: e2e-neg-denied
spec:
  template:
    spec:
      nodeClassRef: {group: scarpenter.sparecores.com, kind: SCNodeClass, name: e2e-arm64}
      requirements:
        - {key: scarpenter.sparecores.com/vendor, operator: In, values: [azure]}
        - {key: karpenter.sh/capacity-type, operator: In, values: [on-demand]}
        - {key: node.kubernetes.io/instance-type, operator: In, values: ["${E2E_TYPE_DENIED}"]}
  disruption: {consolidationPolicy: WhenEmpty, consolidateAfter: 0s}
  limits: {cpu: "2"}
