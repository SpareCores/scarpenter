# The NodeClass of the amd64 scenarios (docs/plans/v1/wip/18-ovh.md, "L5 lane"): the
# tailscale template with pinned versions, the flavor's own disk as the root, a storage
# profile with a small high-speed data volume, a storage profile that asks for local
# storage (unsupported on OVH, for the negative scenario), the placement profile that
# puts a database and its client into one anti-affinity server group, the metadata
# hardening, and a benchmark metric for the described-not-named scenario.
#
# It must exist before the controller starts: the label keys of a NodeClass's
# metrics are registered with Karpenter core at start-up (install.sh applies it
# before the chart).
apiVersion: scarpenter.sparecores.com/v1alpha1
kind: SCNodeClass
metadata:
  name: e2e-amd64
spec:
  flatcar: {channel: ${E2E_FLATCAR_CHANNEL}, version: "${E2E_FLATCAR_VERSION}"}
  kubernetes: {version: "${E2E_KUBERNETES_VERSION}"}
  network:
    template: tailscale
    tailscale:
      version: "${E2E_TAILSCALE_VERSION}"
      # The auth key Secret of install.sh: minted through the Tailscale API,
      # ephemeral, pre-authorized, reusable, tagged, valid for an hour.
      authKeySecretRef: {name: ts-node-key, namespace: scarpenter-system, key: authkey}
      tags: ["${E2E_TAG_NODE}"]
  # The creation time of the run on every server (metadata scarpenter-tag-ci-created-at):
  # the scenarios read it back, and a person finds the run behind a leftover.
  tags: {ci-created-at: "${E2E_CREATED_AT}", ci-run: "${E2E_RUN_ID}"}
  # Pods must not reach the metadata service, where the user data (the bootstrap token
  # and the Tailscale key) is readable.
  bootstrap: {hardening: [metadata-from-pods]}
  metrics:
    single-core:
      benchmark: {id: "geekbench:score", config: {cores: single}}
  profiles:
    storage:
      db-volume:
        ovh:
          data:
            - {name: pgdata, volumeType: high-speed, size: 10Gi, filesystem: xfs, mountPath: /var/lib/pgdata}
      local:
        ovh:
          localStorage: {policy: mount, mountPath: /var/lib/scratch}
    placement:
      spread: {ovh: {serverGroup: {policy: anti-affinity}}}
  vendors:
    ovh:
      regions: [${OS_REGION_NAME}]
      # A short idle lifetime, so that the uninstall scenario sees the NodeClass's
      # security group go (the default is 24 hours).
      resources:
        securityGroups: {create: {lifecycle: {policy: idleTTL, ttl: 5m}}}
