# The NodeClass of the bring-your-own-resources scenario: the security group the workflow
# created with the OpenStack CLI (named <cluster>-byo, no ownership marker) is used, not
# created, by its Neutron UUID. Applied by the scenario, after the group exists.
apiVersion: scarpenter.sparecores.com/v1alpha1
kind: SCNodeClass
metadata:
  name: e2e-use
spec:
  flatcar: {channel: ${E2E_FLATCAR_CHANNEL}, version: "${E2E_FLATCAR_VERSION}"}
  kubernetes: {version: "${E2E_KUBERNETES_VERSION}"}
  network:
    template: tailscale
    tailscale:
      version: "${E2E_TAILSCALE_VERSION}"
      authKeySecretRef: {name: ts-node-key, namespace: scarpenter-system, key: authkey}
      tags: ["${E2E_TAG_NODE}"]
  tags: {ci-created-at: "${E2E_CREATED_AT}", ci-run: "${E2E_RUN_ID}"}
  vendors:
    ovh:
      regions: [${OS_REGION_NAME}]
      resources:
        securityGroups: {use: {ids: {${OS_REGION_NAME}: ["${E2E_BYO_SG}"]}}}
