# Scenario negative: a NodeClass the driver cannot serve. It is never used by a NodePool,
# so nothing is launched.
#   e2e-noipv4  networking.publicIPv4: false: refused (a private-only node needs a billed
#               gateway for its egress, which is not supported): VendorReady False.
apiVersion: scarpenter.sparecores.com/v1alpha1
kind: SCNodeClass
metadata:
  name: e2e-noipv4
spec:
  flatcar: {channel: ${E2E_FLATCAR_CHANNEL}, version: "${E2E_FLATCAR_VERSION}"}
  kubernetes: {version: "${E2E_KUBERNETES_VERSION}"}
  network:
    template: tailscale
    tailscale:
      version: "${E2E_TAILSCALE_VERSION}"
      authKeySecretRef: {name: ts-node-key, namespace: scarpenter-system, key: authkey}
      tags: ["${E2E_TAG_NODE}"]
  tags: {ci-created-at: "${E2E_CREATED_AT}", ci-run: "${E2E_RUN_ID}"}
  networking: {publicIPv4: false}
  vendors:
    ovh:
      regions: [${OS_REGION_NAME}]
