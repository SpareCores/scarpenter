# The values the L5 lane of Alibaba Cloud installs the chart with (install.sh adds the image
# of the build under test). What is left unset is the chart's own default on purpose: the
# cluster DNS is found by the controller (kube-dns Service of the k3s cluster), the
# Keeper is the public one, the sysexts come from the upstream releases, and the
# kubelet client CA is copied from kube-system/extension-apiserver-authentication
# (the client CA of k3s, which `kubectl logs` and `exec` need).
#
# Credentials: the temporary credentials of the CI role (a GitHub OIDC token exchanged for
# a RAM role session by install.sh) are given as a Secret with a security token, mode
# secret. The mode oidc reads a projected service account token of the cluster's own issuer,
# which is not public: not testable on an ephemeral runner, a manual walk of the credentials
# guide. The value names are those the chart was being extended with while this lane was
# written (nothing here has rendered against it: unverified).
cluster:
  name: ${E2E_CLUSTER}
  # The API server's tailnet address: the nodes reach it over Tailscale.
  apiServerEndpoint: https://${E2E_API_HOST}:6443
kubeletClientCA:
  source: extensionApiserverAuthentication
vendors:
  aws:
    enabled: false
  alicloud:
    enabled: true
    homeRegion: ${ALICLOUD_REGION}
    credentials:
      mode: secret
      secret:
        existingSecret: alicloud-credentials
        accessKeyIdKey: ALIBABA_CLOUD_ACCESS_KEY_ID
        accessKeySecretKey: ALIBABA_CLOUD_ACCESS_KEY_SECRET
        securityTokenKey: ALIBABA_CLOUD_SECURITY_TOKEN
# Short intervals: the quota scenarios wait for refreshes (E2E_QUOTA_REFRESH).
quota:
  refreshInterval: 30s
  limitsRefreshInterval: 1m
  launchableRefreshInterval: 5m
gc: {interval: 1m}
# Once its NodeClass is deleted, a managed security group (an idleTTL kind) is governed
# by this default, not by the NodeClass's own 5-minute lifetime: without it the
# uninstall scenario would wait for a 24-hour TTL.
managedResources: {defaultTTL: 5m}
karpenter:
  logLevel: debug
# The control plane's node carries the CriticalAddonsOnly taint (bootstrap.sh), so
# that test workloads land on SCarpenter's nodes only.
tolerations:
  - {key: CriticalAddonsOnly, operator: Exists}
resources:
  requests: {cpu: 200m, memory: 640Mi}
  limits: {memory: 1536Mi}
