# The NodeClass of the manual gpu scenario: the tailscale template, the registry mirror in
# its own Butane (e2e-gpu-node-butane: the nvidia-runtime sysext replaces the containerd
# command line, so the other NodeClasses' mirror would not be read), and the default root disk (the GPU plan's included 300 GB: the driver
# sysext and the CUDA images need more than the 25 GB of the others).
apiVersion: scarpenter.sparecores.com/v1alpha1
kind: SCNodeClass
metadata:
  name: e2e-gpu
spec:
  flatcar: {channel: ${E2E_FLATCAR_CHANNEL}, version: "${E2E_FLATCAR_VERSION}"}
  kubernetes: {version: "${E2E_KUBERNETES_VERSION}"}
  butane: {configMapRef: {name: e2e-gpu-node-butane, namespace: scarpenter-system, key: butane.yaml}}
  network:
    template: tailscale
    tailscale:
      version: "${E2E_TAILSCALE_VERSION}"
      authKeySecretRef: {name: ts-node-key, namespace: scarpenter-system, key: authkey}
      tags: ["${E2E_TAG_NODE}"]
  networking: {isolation: none}
  tags: {ci-run: "${E2E_RUN_ID}"}
  vendors:
    upcloud:
      regions: [${UPCLOUD_ZONE}]
      resources:
        images: {use: {tags: {scarpenter-lane: ci, flatcar-channel: "${E2E_FLATCAR_CHANNEL}", flatcar-version: "${E2E_FLATCAR_VERSION}", flatcar-arch: amd64}}}
