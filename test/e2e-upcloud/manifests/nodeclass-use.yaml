# The NodeClass of the bring-your-own-resources scenario: the SDN network and ruleset the
# workflow created through the API (labelled scarpenter-e2e-byo=<cluster>, and with the
# cluster label, so that the sweeper reaps them if the run dies) are used, not created.
# Applied by the scenario, after the resources exist. The labels are the driver's, as
# the discovery of an operator's resources would find them.
apiVersion: scarpenter.sparecores.com/v1alpha1
kind: SCNodeClass
metadata:
  name: e2e-use
spec:
  flatcar: {channel: ${E2E_FLATCAR_CHANNEL}, version: "${E2E_FLATCAR_VERSION}"}
  kubernetes: {version: "${E2E_KUBERNETES_VERSION}"}
  network:
    template: tailscale
    tailscale:
      version: "${E2E_TAILSCALE_VERSION}"
      # The auth key Secret of install.sh: minted through the Tailscale API,
      # ephemeral, pre-authorized, reusable, tagged, valid for an hour.
      authKeySecretRef: {name: ts-node-key, namespace: scarpenter-system, key: authkey}
      tags: ["${E2E_TAG_NODE}"]
  tags: {ci-run: "${E2E_RUN_ID}"}
  vendors:
    upcloud:
      regions: [${UPCLOUD_ZONE}]
      storage:
        root: {size: 25Gi}
      resources:
        networks: {use: {tags: {scarpenter-e2e-byo: "${E2E_CLUSTER}"}}}
        firewalls: {use: {tags: {scarpenter-e2e-byo: "${E2E_CLUSTER}"}}}
