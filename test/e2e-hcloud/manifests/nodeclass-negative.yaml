# Scenario negative: NodeClasses the project cannot serve.
#   e2e-noipv4  publicIPv4 false and no IPv6: refused (a server needs a public address; private-only
#               servers are not supported in v1). Never used by a NodePool.
#   e2e-noarm   a NodeClass for a location without the arm types, with a NodePool pinned to
#               hcloud.cax11 there: the Pod stays Pending and nothing is launched.
apiVersion: scarpenter.sparecores.com/v1alpha1
kind: SCNodeClass
metadata:
  name: e2e-noipv4
spec:
  flatcar: {channel: ${E2E_FLATCAR_CHANNEL}, version: "${E2E_FLATCAR_VERSION}"}
  kubernetes: {version: "${E2E_KUBERNETES_VERSION}"}
  network:
    template: tailscale
    tailscale:
      version: "${E2E_TAILSCALE_VERSION}"
      # The auth key Secret of install.sh: minted through the Tailscale API,
      # ephemeral, pre-authorized, reusable, tagged, valid for an hour.
      authKeySecretRef: {name: ts-node-key, namespace: scarpenter-system, key: authkey}
      tags: ["${E2E_TAG_NODE}"]
  # The creation time on every resource of the run, which the sweeper needs: a firewall or a
  # volume has labels, and the sweeper filters by this one (ci-created-at, Unix seconds).
  tags: {ci-created-at: "${E2E_CREATED_AT}", ci-run: "${E2E_RUN_ID}"}
  networking: {publicIPv4: false}
  vendors:
    hcloud:
      regions: [${E2E_NEGATIVE_LOCATION}]
---
apiVersion: scarpenter.sparecores.com/v1alpha1
kind: SCNodeClass
metadata:
  name: e2e-noarm
spec:
  flatcar: {channel: ${E2E_FLATCAR_CHANNEL}, version: "${E2E_FLATCAR_VERSION}"}
  kubernetes: {version: "${E2E_KUBERNETES_VERSION}"}
  network:
    template: tailscale
    tailscale:
      version: "${E2E_TAILSCALE_VERSION}"
      # The auth key Secret of install.sh: minted through the Tailscale API,
      # ephemeral, pre-authorized, reusable, tagged, valid for an hour.
      authKeySecretRef: {name: ts-node-key, namespace: scarpenter-system, key: authkey}
      tags: ["${E2E_TAG_NODE}"]
  # The creation time on every resource of the run, which the sweeper needs: a firewall or a
  # volume has labels, and the sweeper filters by this one (ci-created-at, Unix seconds).
  tags: {ci-created-at: "${E2E_CREATED_AT}", ci-run: "${E2E_RUN_ID}"}
  vendors:
    hcloud:
      regions: [${E2E_NEGATIVE_LOCATION}]
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: e2e-noarm
spec:
  template:
    spec:
      nodeClassRef: {group: scarpenter.sparecores.com, kind: SCNodeClass, name: e2e-noarm}
      requirements:
        - {key: scarpenter.sparecores.com/vendor, operator: In, values: [hcloud]}
        - {key: kubernetes.io/arch, operator: In, values: [arm64]}
        - {key: node.kubernetes.io/instance-type, operator: In, values: ["${E2E_TYPE_ARM64}"]}
        - {key: topology.kubernetes.io/zone, operator: In, values: ["${E2E_NEGATIVE_LOCATION}"]}
  disruption: {consolidationPolicy: WhenEmpty, consolidateAfter: 0s}
  limits: {cpu: "2"}
