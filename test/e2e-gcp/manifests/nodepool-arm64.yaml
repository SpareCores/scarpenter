# The pool of the optional arm64 spot scenario (E2E_ARM64=true).
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: e2e-arm64
spec:
  template:
    spec:
      nodeClassRef: {group: scarpenter.sparecores.com, kind: SCNodeClass, name: e2e-arm64}
      requirements:
        - {key: scarpenter.sparecores.com/vendor, operator: In, values: [gcp]}
        - {key: kubernetes.io/arch, operator: In, values: [arm64]}
        - {key: karpenter.sh/capacity-type, operator: In, values: [spot]}
        - {key: node.kubernetes.io/instance-type, operator: In, values: ["${E2E_TYPE_ARM64}"]}
  disruption: {consolidationPolicy: WhenEmpty, consolidateAfter: 0s}
  limits: {cpu: "4"}
