# The pool of the bring-your-own-resources scenario.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: e2e-use
spec:
  template:
    spec:
      nodeClassRef: {group: scarpenter.sparecores.com, kind: SCNodeClass, name: e2e-use}
      requirements:
        - {key: scarpenter.sparecores.com/vendor, operator: In, values: [gcp]}
        - {key: kubernetes.io/arch, operator: In, values: [amd64]}
        - {key: karpenter.sh/capacity-type, operator: In, values: [on-demand]}
        - {key: node.kubernetes.io/instance-type, operator: In, values: ["${E2E_TYPE_AMD64}"]}
  disruption: {consolidationPolicy: WhenEmpty, consolidateAfter: 0s}
  limits: {cpu: "2"}
