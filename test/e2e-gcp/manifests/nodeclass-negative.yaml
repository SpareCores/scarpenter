# Scenario negative: NodeClasses the driver must refuse or cannot serve. They are never used
# by a NodePool, so nothing is launched.
#   e2e-badproject  a project that is not the controller's: the vendor condition says so
#                   (plan 16 section 2: the NodeClass project, when set, must equal the
#                   controller's), a visible condition and not a launch error.
#   e2e-noipv4      publicIPv4: false: a node without an external address has no egress
#                   unless the subnet has a Cloud NAT. What the driver does with it
#                   (refuse, or accept and leave the egress to the network) is recorded by
#                   the scenario as a note for the first live run.
apiVersion: scarpenter.sparecores.com/v1alpha1
kind: SCNodeClass
metadata:
  name: e2e-badproject
spec:
  flatcar: {channel: ${E2E_FLATCAR_CHANNEL}, version: "${E2E_FLATCAR_VERSION}"}
  kubernetes: {version: "${E2E_KUBERNETES_VERSION}"}
  network:
    template: tailscale
    tailscale:
      version: "${E2E_TAILSCALE_VERSION}"
      # The auth key Secret of install.sh: minted through the Tailscale API,
      # ephemeral, pre-authorized, reusable, tagged, valid for an hour.
      authKeySecretRef: {name: ts-node-key, namespace: scarpenter-system, key: authkey}
      tags: ["${E2E_TAG_NODE}"]
  # The creation time and the run on every instance and disk of the run, which the
  # sweeper reads (label keys and values: lower case, digits, - and _).
  tags: {ci-created-at: "${E2E_CREATED_AT}", ci-run: "${E2E_RUN_ID}"}
  vendors:
    gcp:
      project: scarpenter-no-such-project
      regions: [${GCP_REGION}]
---
apiVersion: scarpenter.sparecores.com/v1alpha1
kind: SCNodeClass
metadata:
  name: e2e-noipv4
spec:
  flatcar: {channel: ${E2E_FLATCAR_CHANNEL}, version: "${E2E_FLATCAR_VERSION}"}
  kubernetes: {version: "${E2E_KUBERNETES_VERSION}"}
  network:
    template: tailscale
    tailscale:
      version: "${E2E_TAILSCALE_VERSION}"
      # The auth key Secret of install.sh: minted through the Tailscale API,
      # ephemeral, pre-authorized, reusable, tagged, valid for an hour.
      authKeySecretRef: {name: ts-node-key, namespace: scarpenter-system, key: authkey}
      tags: ["${E2E_TAG_NODE}"]
  # The creation time and the run on every instance and disk of the run, which the
  # sweeper reads (label keys and values: lower case, digits, - and _).
  tags: {ci-created-at: "${E2E_CREATED_AT}", ci-run: "${E2E_RUN_ID}"}
  networking: {publicIPv4: false}
  vendors:
    gcp:
      project: ${GCP_PROJECT}
      regions: [${GCP_REGION}]
