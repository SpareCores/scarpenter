# The NodeClass of the bring-your-own-resources scenario: the network, the subnet and the
# firewall rule (network tag) the workflow created with gcloud (named
# scarpenter-e2e-byo-<run id>*, described with the lane marker, which the sweeper reads and
# the controller's garbage collector does not recognize) are used, not created. Applied by
# the scenario, after the resources exist.
apiVersion: scarpenter.sparecores.com/v1alpha1
kind: SCNodeClass
metadata:
  name: e2e-use
spec:
  flatcar: {channel: ${E2E_FLATCAR_CHANNEL}, version: "${E2E_FLATCAR_VERSION}"}
  kubernetes: {version: "${E2E_KUBERNETES_VERSION}"}
  network:
    template: tailscale
    tailscale:
      version: "${E2E_TAILSCALE_VERSION}"
      # The auth key Secret of install.sh: minted through the Tailscale API,
      # ephemeral, pre-authorized, reusable, tagged, valid for an hour.
      authKeySecretRef: {name: ts-node-key, namespace: scarpenter-system, key: authkey}
      tags: ["${E2E_TAG_NODE}"]
  # The creation time and the run on every instance and disk of the run, which the
  # sweeper reads (label keys and values: lower case, digits, - and _).
  tags: {ci-created-at: "${E2E_CREATED_AT}", ci-run: "${E2E_RUN_ID}"}
  vendors:
    gcp:
      project: ${GCP_PROJECT}
      regions: [${GCP_REGION}]
      storage:
        root: {diskType: pd-balanced, sizeGb: 20}
      resources:
        subnets: {use: {ids: {${GCP_REGION}: ["${E2E_BYO_SUBNET}"]}}}
        firewalls: {use: {ids: {${GCP_REGION}: ["${E2E_BYO_TAG}"]}}}
