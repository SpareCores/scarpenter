# kube-proxy as a DaemonSet, for the L4 lane's k3s (--disable-kube-proxy): the
# control plane has no node, so the proxy runs on the remote nodes only, like in
# a production cluster with remote workers. It reaches the API server by its
# address (@API_HOST@), because the ClusterIP it would use needs the proxy
# itself.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-proxy
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scarpenter-lane-kube-proxy
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "system:node-proxier"}
subjects:
  - {kind: ServiceAccount, name: kube-proxy, namespace: kube-system}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-proxy
  namespace: kube-system
  labels: {k8s-app: kube-proxy}
spec:
  selector:
    matchLabels: {k8s-app: kube-proxy}
  template:
    metadata:
      labels: {k8s-app: kube-proxy}
    spec:
      hostNetwork: true
      priorityClassName: system-node-critical
      serviceAccountName: kube-proxy
      tolerations:
        - operator: Exists
      containers:
        - name: kube-proxy
          image: registry.k8s.io/kube-proxy:v1.37.1
          command:
            - /usr/local/bin/kube-proxy
            - --proxy-mode=iptables
            - --cluster-cidr=10.42.0.0/16
            - --hostname-override=$(NODE_NAME)
          env:
            - {name: KUBERNETES_SERVICE_HOST, value: "@API_HOST@"}
            - {name: KUBERNETES_SERVICE_PORT, value: "6443"}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          securityContext:
            privileged: true
          volumeMounts:
            - {name: xtables-lock, mountPath: /run/xtables.lock}
            - {name: lib-modules, mountPath: /lib/modules, readOnly: true}
      volumes:
        - {name: xtables-lock, hostPath: {path: /run/xtables.lock, type: FileOrCreate}}
        - {name: lib-modules, hostPath: {path: /lib/modules}}
