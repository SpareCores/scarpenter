# What the lane needs besides config/rbac (SCarpenter's own permissions and the
# node-join bindings, which run.sh applies): Karpenter core's permissions, as in
# the L3 lane, and nothing for the qemu driver (it talks to the machine, not to
# the API server).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scarpenter-qemu-lane
rules:
  - apiGroups: ["karpenter.sh"]
    resources: ["nodepools", "nodepools/status", "nodeclaims", "nodeclaims/status", "nodeoverlays", "nodeoverlays/status"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
  - apiGroups: ["autoscaling.x-k8s.io"]
    resources: ["capacitybuffers", "capacitybuffers/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "persistentvolumes", "persistentvolumeclaims", "replicationcontrollers", "namespaces", "podtemplates", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes", "volumeattachments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scarpenter-qemu-lane
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: scarpenter-qemu-lane}
subjects:
  - {kind: ServiceAccount, name: scarpenter, namespace: scarpenter-system}
