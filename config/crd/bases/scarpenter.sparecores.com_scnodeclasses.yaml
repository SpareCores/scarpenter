                      storage:
                        description: |-
                          storage overrides the built-in storage defaults (a cloud_essd PL0 system
                          disk of 64 GiB, not encrypted; no data disks).
                        properties:
                          data:
                            description: data lists extra disks created with the instance
                              (all deleted with it).
                            items:
                              description: |-
                                DataDisk is an extra disk: ECS settings plus the guest side (name,
                                filesystem, mount path).
                              properties:
                                burstingEnabled:
                                  description: burstingEnabled turns performance bursting
                                    on for a cloud_auto disk.
                                  type: boolean
                                category:
                                  description: category is the disk category. Built-in
                                    default cloud_essd.
                                  enum:
                                  - cloud_essd
                                  - cloud_auto
                                  - cloud_essd_entry
                                  - cloud_efficiency
                                  - cloud_ssd
                                  type: string
                                encrypted:
                                  description: encrypted encrypts the disk. Built-in
                                    default false.
                                  type: boolean
                                filesystem:
                                  default: ext4
                                  description: filesystem the first-boot unit creates
                                    on the volume.
                                  enum:
                                  - ext4
                                  - xfs
                                  - btrfs
                                  type: string
                                kmsKeyID:
                                  description: kmsKeyID is the KMS key used for encryption.
                                  maxLength: 2048
                                  type: string
                                mountPath:
                                  description: mountPath is the absolute path the
                                    volume is mounted at.
                                  maxLength: 255
                                  pattern: ^/[^\x00]*$
                                  type: string
                                name:
                                  description: |-
                                    name identifies the volume in the profile and in the device hints
                                    rendered into Ignition.
                                  maxLength: 40
                                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                                  type: string
                                performanceLevel:
                                  description: performanceLevel of a cloud_essd disk.
                                    Built-in default PL0.
                                  enum:
                                  - PL0
                                  - PL1
                                  - PL2
                                  - PL3
                                  type: string
                                provisionedIops:
                                  description: provisionedIops of a cloud_auto disk.
                                  format: int64
                                  maximum: 50000
                                  minimum: 0
                                  type: integer
                                size:
                                  anyOf:
                                  - type: integer
                                  - type: string
                                  description: size of the disk, e.g. 100Gi.
                                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                  x-kubernetes-int-or-string: true
