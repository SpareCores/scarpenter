---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: scnodeclasses.scarpenter.sparecores.com
spec:
  group: scarpenter.sparecores.com
  names:
    categories:
    - karpenter
    kind: SCNodeClass
    listKind: SCNodeClassList
    plural: scnodeclasses
    shortNames:
    - scnc
    singular: scnodeclass
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.vendorNames
      name: Vendors
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SCNodeClass is the node definition SCarpenter launches nodes from: shared
          settings plus a block per vendor.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SCNodeClassSpec is the node definition shared by every vendor, plus a typed
              block per vendor (ADR-014). Which vendor a NodeClaim uses is chosen by the
              NodePool's scarpenter.sparecores.com/vendor requirement.
            properties:
              billing:
                description: |-
                  billing opts in to keeping nodes until the end of the billing period
                  they have already paid for (ADR-024). Changing it is not drift.
                properties:
                  margin:
                    default: 3m
                    description: |-
                      margin is how long before the end of the period the node is released:
                      it has to cover the drain, the termination finalizer, the vendor's
                      delete and clock skew. At least 90 s; a vendor with a slow delete
                      widens it.
                    pattern: ^([0-9]+(\.[0-9]+)?(s|m|h))+$
                    type: string
                    x-kubernetes-validations:
                    - message: margin must be at least 90s
                      rule: duration(self) >= duration('90s')
                  maxRetainedNodes:
                    description: |-
                      maxRetainedNodes is an optional safety valve: it trims the held empty
                      nodes of the NodeClass down to this number, nearest deadline first.
                      Unset means no cap; a launch blocked by a NodePool limit or a vendor
                      quota releases held empty nodes first either way.
                    format: int32
                    minimum: 1
                    type: integer
                  minPeriod:
                    default: 10m
                    description: |-
                      minPeriod is the shortest billing increment that is held to its end:
                      shorter increments are not worth a hold. It does not gate the hold of a
                      minimum (a minimum has its own 2 minute floor).
                    pattern: ^([0-9]+(\.[0-9]+)?(s|m|h))+$
                    type: string
                    x-kubernetes-validations:
                    - message: minPeriod must be at least 1m
                      rule: duration(self) >= duration('1m')
                  retainUntilPeriodEnd:
                    default: false
                    description: |-
                      retainUntilPeriodEnd keeps a node a vendor bills by the started period
                      (an hour on hcloud, UpCloud, Vultr), or by a minimum and then per second
                      (Alibaba), until its paid period is about to end, so that Karpenter
                      reuses it for the next job, and deletes it before the next charge starts.
                      Off by default.
                    type: boolean
                type: object
              bootstrap:
                description: |-
                  bootstrap holds the opt-in changes to the node's boot configuration that
                  a vendor's driver can contribute (plan 14 A7).
                properties:
                  hardening:
                    description: |-
                      hardening lists the opt-in hardenings of the boot configuration. Off by
                      default: they change what Pods on the node can reach. A vendor whose driver
                      offers none of them (AWS) ignores the list and says so in an Event.
                    items:
                      description: |-
                        Hardening is a named, opt-in hardening of the node's boot configuration. A
                        driver that offers it contributes a Butane fragment that the core merges into
                        the base config.
                      enum:
                      - metadata-from-pods
                      type: string
                    maxItems: 8
                    type: array
                    x-kubernetes-list-type: set
                type: object
              butane:
                description: |-
                  butane references extra Butane configuration merged into every node's
                  Ignition.
                properties:
                  configMapRef:
                    description: configMapRef references the ConfigMap key holding
                      the Butane config.
                    properties:
                      key:
                        maxLength: 253
                        minLength: 1
                        type: string
                      name:
                        maxLength: 253
                        minLength: 1
                        type: string
                      namespace:
                        maxLength: 63
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    - namespace
                    type: object
                required:
                - configMapRef
                type: object
              catalog:
                description: catalog configures the instance type catalog built from
                  Keeper.
                properties:
                  cpuFlagLabels:
                    description: |-
                      cpuFlagLabels are the CPU flags that get a cpu-flag-<flag> label on
                      instance types. The set is closed: the labels are registered with
                      Karpenter core at start-up, so only this curated list of flags useful
                      for workload selection (names as in Keeper's cpu_flags, Linux
                      /proc/cpuinfo spelling) is accepted. Defaults to avx2, avx512f,
                      amx_tile and sha_ni.
                    items:
                      enum:
                      - avx
                      - avx2
                      - avx512f
                      - avx512bw
                      - avx512vl
                      - avx512dq
                      - avx512cd
                      - avx512_vnni
                      - avx512_bf16
                      - avx512_fp16
                      - avx512vbmi
                      - avx512ifma
                      - avx_vnni
                      - amx_tile
                      - amx_bf16
                      - amx_int8
                      - sha_ni
                      - aes
                      - vaes
                      - gfni
                      - pclmulqdq
                      - bmi2
                      - fma
                      - sse4_2
                      - asimd
                      - sve
                      - sve2
                      - sha2
                      - sha3
                      type: string
                    maxItems: 32
                    type: array
                    x-kubernetes-list-type: set
                type: object
              flatcar:
                description: flatcar selects the Flatcar Container Linux release nodes
                  boot.
                properties:
                  channel:
                    default: stable
                    description: channel of the release.
                    enum:
                    - stable
                    - beta
                    - alpha
                    - lts
                    type: string
                  version:
                    description: version is the pinned release, e.g. 4757.2.3. Changing
                      it drifts nodes.
                    pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
                    type: string
                required:
                - version
                type: object
              kubelet:
                default: {}
                description: |-
                  kubelet configures the kubelet and the node capacity the scheduler
                  assumes.
                properties:
                  evictionHard:
                    additionalProperties:
                      type: string
                    description: 'evictionHard thresholds, e.g. memory.available:
                      100Mi.'
                    maxProperties: 6
                    type: object
                  kubeReserved:
                    additionalProperties:
                      type: string
                    description: |-
                      kubeReserved overrides the computed resources reserved for Kubernetes
                      daemons.
                    maxProperties: 4
                    type: object
                  maxPods:
                    default: 110
                    description: maxPods is the maximum number of Pods per node.
                    format: int32
                    maximum: 1000
                    minimum: 1
                    type: integer
                  systemReserved:
                    additionalProperties:
                      type: string
                    description: systemReserved resources for system daemons.
                    maxProperties: 4
                    type: object
                  vmMemoryOverheadPercent:
                    default: 7.5
                    description: |-
                      vmMemoryOverheadPercent is the share of the catalog memory a VM does
                      not offer to the guest, subtracted from the instance type's capacity.
                    maximum: 50
                    minimum: 0
                    type: number
                type: object
                x-kubernetes-validations:
                - message: systemReserved keys must be cpu, memory, ephemeral-storage
                    or pid
                  rule: '!has(self.systemReserved) || self.systemReserved.all(k, k
                    in [''cpu'', ''memory'', ''ephemeral-storage'', ''pid''])'
                - message: kubeReserved keys must be cpu, memory, ephemeral-storage
                    or pid
                  rule: '!has(self.kubeReserved) || self.kubeReserved.all(k, k in
                    [''cpu'', ''memory'', ''ephemeral-storage'', ''pid''])'
                - message: evictionHard keys must be eviction signals
                  rule: '!has(self.evictionHard) || self.evictionHard.all(k, k in
                    [''memory.available'', ''nodefs.available'', ''nodefs.inodesFree'',
                    ''imagefs.available'', ''imagefs.inodesFree'', ''pid.available''])'
              kubernetes:
                description: |-
                  kubernetes selects the Kubernetes release (a sysext-bakery release)
                  nodes run.
                properties:
                  version:
                    description: version of a sysext-bakery Kubernetes release, e.g.
                      v1.37.1.
                    pattern: ^v[0-9]+\.[0-9]+\.[0-9]+$
                    type: string
                required:
                - version
                type: object
              metrics:
                additionalProperties:
                  description: |-
                    Metric defines a benchmark metric: a benchmark or a workload profile,
                    optionally normalised per vCPU. Exactly one of benchmark and workloadProfile
                    is set.
                  properties:
                    benchmark:
                      description: benchmark identifies a Spare Cores benchmark (id
                        and config).
                      properties:
                        config:
                          description: |-
                            config is a JSON object. Required when the benchmark has more than one
                            config; validated against Keeper's benchmark_configs by comparing
                            parsed objects.
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        id:
                          description: id is a benchmark_id, for example geekbench:score.
                          maxLength: 128
                          minLength: 1
                          type: string
                      required:
                      - id
                      type: object
                    normalize:
                      default: None
                      description: normalize is applied to the score before the labels
                        are computed.
                      enum:
                      - None
                      - PerVcpu
                      type: string
                    scale:
                      default: 1
                      description: |-
                        scale multiplies the score before it is rounded to the integer label
                        value, to keep precision (e.g. 100).
                      format: int32
                      maximum: 1000000
                      minimum: 1
                      type: integer
                    workloadProfile:
                      description: workloadProfile is one of the Spare Cores compound
                        workload benchmarks.
                      enum:
                      - web
                      - compute
                      - cache
                      - data_analysis
                      - llm
                      - cicd
                      type: string
                  type: object
                  x-kubernetes-validations:
                  - message: set exactly one of benchmark and workloadProfile
                    rule: has(self.benchmark) != has(self.workloadProfile)
                description: |-
                  metrics define benchmark metric labels (metric-<name>, -pct and -per-usd)
                  on instance types and offerings.
                maxProperties: 32
                type: object
                x-kubernetes-validations:
                - message: metric names are lower-case label-safe slugs of at most
                    40 characters
                  rule: self.all(k, k.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$') &&
                    size(k) <= 40)
              network:
                description: |-
                  network is the node bootstrap network template (how nodes reach the
                  control plane).
                properties:
                  custom:
                    description: custom configures the custom template.
                    properties:
                      configMapRef:
                        description: configMapRef references the ConfigMap key holding
                          the Butane template.
                        properties:
                          key:
                            maxLength: 253
                            minLength: 1
                            type: string
                          name:
                            maxLength: 253
                            minLength: 1
                            type: string
                          namespace:
                            maxLength: 63
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        - namespace
                        type: object
                    required:
                    - configMapRef
                    type: object
                  tailscale:
                    description: tailscale configures the tailscale template.
                    properties:
                      authKeySecretRef:
                        description: |-
                          authKeySecretRef references the Secret key holding the auth key nodes
                          join the tailnet with.
                        properties:
                          key:
                            maxLength: 253
                            minLength: 1
                            type: string
                          name:
                            maxLength: 253
                            minLength: 1
                            type: string
                          namespace:
                            maxLength: 63
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        - namespace
                        type: object
                      loginServer:
                        description: |-
                          loginServer is the coordination server URL; empty means Tailscale SaaS,
                          set it for Headscale.
                        pattern: ^(https?://[^\s]+)?$
                        type: string
                      tags:
                        description: tags are the ACL tags nodes advertise.
                        items:
                          pattern: ^tag:[a-zA-Z0-9][a-zA-Z0-9-]*$
                          type: string
                        maxItems: 16
                        type: array
                        x-kubernetes-list-type: set
                      version:
                        description: version of the Tailscale sysext, e.g. v1.98.10.
                        pattern: ^v[0-9]+\.[0-9]+\.[0-9]+$
                        type: string
                    required:
                    - authKeySecretRef
                    - version
                    type: object
                  template:
                    description: |-
                      template: tailscale joins nodes through a tailnet, direct has nodes
                      reach the API server directly, custom renders your own Butane template.
                    enum:
                    - tailscale
                    - direct
                    - custom
                    type: string
                required:
                - template
                type: object
                x-kubernetes-validations:
                - message: network.tailscale is required with template tailscale and
                    invalid otherwise
                  rule: 'self.template == ''tailscale'' ? has(self.tailscale) : !has(self.tailscale)'
                - message: network.custom is required with template custom and invalid
                    otherwise
                  rule: 'self.template == ''custom'' ? has(self.custom) : !has(self.custom)'
              networking:
                default: {}
                description: |-
                  networking is the generic network setting, identical in meaning on every
                  vendor; vendor blocks may override it.
                properties:
                  inbound:
                    description: |-
                      inbound lists the allowed inbound traffic. Without rules everything
                      inbound is denied (a deny firewall is attached where the vendor default
                      is open).
                    properties:
                      rules:
                        description: rules allow traffic from CIDRs; everything else
                          is denied.
                        items:
                          description: InboundRule allows inbound traffic from CIDRs.
                          properties:
                            cidrs:
                              description: cidrs are the allowed source networks.
                              items:
                                maxLength: 43
                                type: string
                              maxItems: 32
                              minItems: 1
                              type: array
                              x-kubernetes-list-type: set
                            fromPort:
                              description: |-
                                fromPort is the first port of the range (tcp and udp); without ports
                                the rule covers every port.
                              format: int32
                              maximum: 65535
                              minimum: 1
                              type: integer
                            protocol:
                              description: protocol of the rule.
                              enum:
                              - tcp
                              - udp
                              - icmp
                              - any
                              type: string
                            toPort:
                              description: toPort is the last port of the range; defaults
                                to fromPort.
                              format: int32
                              maximum: 65535
                              minimum: 1
                              type: integer
                          required:
                          - cidrs
                          - protocol
                          type: object
                          x-kubernetes-validations:
                          - message: ports are only valid for tcp and udp
                            rule: '!has(self.fromPort) || self.protocol == ''tcp''
                              || self.protocol == ''udp'''
                          - message: toPort needs fromPort
                            rule: '!has(self.toPort) || has(self.fromPort)'
                          - message: toPort must not be smaller than fromPort
                            rule: '!has(self.toPort) || self.toPort >= self.fromPort'
                          - message: cidrs must be valid CIDR notation
                            rule: self.cidrs.all(c, isCIDR(c))
                        maxItems: 32
                        type: array
                        x-kubernetes-list-type: atomic
                    type: object
                  isolation:
                    default: run
                    description: |-
                      isolation decides who may reach a node privately: none (no other node:
                      the strictest, only inbound rules apply; it does not mean "not isolated"),
                      the nodes of the SCNodeClass, or only the nodes of the same run (placement
                      group run key; without a run key the nodes of the SCNodeClass are one run).
                    enum:
                    - none
                    - nodeclass
                    - run
                    type: string
                  publicIPv4:
                    default: true
                    description: publicIPv4 gives nodes a public IPv4 address.
                    type: boolean
                  publicIPv6:
                    default: false
                    description: publicIPv6 gives nodes a public IPv6 address.
                    type: boolean
                type: object
              poweroffAfter:
                description: |-
                  poweroffAfter powers a node off after this long: a fail-safe against
                  instances that outlive their NodeClaim.
                pattern: ^([0-9]+(\.[0-9]+)?(s|m|h))+$
                type: string
              pricing:
                default: {}
                description: pricing configures how offerings are priced.
                properties:
                  allowIncomplete:
                    default: true
                    description: |-
                      allowIncomplete allows offerings whose price misses components the data
                      does not have (provisioned IOPS, dedicated tenancy, paid bandwidth).
                      Such nodes are annotated scarpenter.sparecores.com/price-incomplete.
                    type: boolean
                type: object
              profiles:
                default: {}
                description: |-
                  profiles are named, explicit, vendor-native setups that workloads pick
                  by name through labels.
                properties:
                  network:
                    additionalProperties:
                      description: NetworkProfile is a named network setup (NIC features)
                        per vendor.
                      minProperties: 1
                      properties:
                        alicloud:
                          description: Network is the Alibaba Cloud block of a network
                            profile.
                          properties:
                            internetChargeType:
                              description: internetChargeType is how the public bandwidth
                                is billed.
                              enum:
                              - PayByTraffic
                              - PayByBandwidth
                              type: string
                            internetMaxBandwidthOut:
                              description: |-
                                internetMaxBandwidthOut is the peak public outbound bandwidth in Mbit/s;
                                0 means no public IPv4 address.
                              format: int32
                              maximum: 100
                              minimum: 0
                              type: integer
                          type: object
                        aws:
                          description: Network is the AWS block of a network profile.
                          properties:
                            enaExpress:
                              description: enaExpress configures ENA Express on supported
                                instance types.
                              properties:
                                enabled:
                                  description: enabled turns ENA Express on.
                                  type: boolean
                                udp:
                                  description: udp enables ENA Express for UDP traffic
                                    as well.
                                  type: boolean
                              required:
                              - enabled
                              type: object
                          type: object
                        azure:
                          description: Network is the Azure block of a network profile.
                          properties:
                            acceleratedNetworking:
                              description: |-
                                acceleratedNetworking configures SR-IOV on the NIC. auto (the built-in
                                default) turns it on for sizes that support it and off elsewhere; true makes
                                the other sizes infeasible.
                              properties:
                                enabled:
                                  description: enabled is auto, "true" or "false"
                                    (quote the booleans).
                                  enum:
                                  - auto
                                  - "true"
                                  - "false"
                                  type: string
                              required:
                              - enabled
                              type: object
                          type: object
                        fake:
                          description: Network is the fake block of a network profile.
                          properties:
                            accelerated:
                              description: accelerated marks the fake nodes as having
                                accelerated networking.
                              type: boolean
                          type: object
                        qemu:
                          description: Network is the qemu block of a network profile.
                          properties:
                            model:
                              description: model of the emulated network card.
                              enum:
                              - virtio-net-pci
                              - e1000
                              type: string
                          type: object
                        vultr:
                          description: |-
                            Network is the Vultr block of a network profile. Empty in v1: Vultr's create
                            call has no NIC features.
                          type: object
                      type: object
                    description: 'network profiles: NIC features.'
                    maxProperties: 32
                    type: object
                    x-kubernetes-validations:
                    - message: profile names are lower-case label-safe slugs
                      rule: self.all(k, k.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
                        && size(k) <= 63)
                    - message: the profile name 'default' is reserved for the vendor
                        defaults
                      rule: '!(''default'' in self)'
                  placement:
                    additionalProperties:
                      description: PlacementProfile is a named placement and tenancy
                        setup per vendor.
                      minProperties: 1
                      properties:
                        alicloud:
                          description: Placement is the Alibaba Cloud block of a placement
                            profile.
                          properties:
                            deploymentSet:
                              description: |-
                                deploymentSet is the placement construct nodes join; it needs a run key
                                (label placement-group) to be created per run.
                              properties:
                                strategy:
                                  description: strategy of the deployment sets SCarpenter
                                    creates.
                                  enum:
                                  - LowLatency
                                  - Availability
                                  type: string
                                use:
                                  description: |-
                                    use references an existing deployment set, which is never modified or
                                    deleted; the run key then only separates NodeClaims.
                                  properties:
                                    name:
                                      description: name of the deployment set.
                                      maxLength: 128
                                      minLength: 1
                                      type: string
                                  required:
                                  - name
                                  type: object
                              type: object
                              x-kubernetes-validations:
                              - message: set exactly one of strategy and use
                                rule: has(self.strategy) != has(self.use)
                          type: object
                        aws:
                          description: |-
                            Placement is the AWS block of a placement profile: a placement group and the
                            tenancy.
                          properties:
                            placementGroup:
                              description: |-
                                placementGroup is the placement construct nodes join; it needs a run key
                                (label placement-group) to be created per run.
                              properties:
                                partitionCount:
                                  description: partitionCount is the number of partitions
                                    (strategy partition).
                                  format: int32
                                  maximum: 7
                                  minimum: 1
                                  type: integer
                                strategy:
                                  description: strategy of the placement groups SCarpenter
                                    creates.
                                  enum:
                                  - cluster
                                  - partition
                                  - spread
                                  type: string
                                use:
                                  description: |-
                                    use references an existing placement group, which is never modified or
                                    deleted; the run key then only separates NodeClaims.
                                  properties:
                                    name:
                                      description: name of the placement group.
                                      maxLength: 255
                                      minLength: 1
                                      type: string
                                  required:
                                  - name
                                  type: object
                              type: object
                              x-kubernetes-validations:
                              - message: set exactly one of strategy and use
                                rule: has(self.strategy) != has(self.use)
                              - message: partitionCount is only valid with strategy
                                  partition
                                rule: '!has(self.partitionCount) || (has(self.strategy)
                                  && self.strategy == ''partition'')'
                            tenancy:
                              description: |-
                                tenancy of the instances: dedicated runs them on single-tenant
                                hardware.
                              enum:
                              - default
                              - dedicated
                              type: string
                          type: object
                        azure:
                          description: Placement is the Azure block of a placement
                            profile.
                          properties:
                            proximityPlacementGroup:
                              description: |-
                                proximityPlacementGroup is the placement construct nodes join; a profile
                                that creates groups needs a run key (label placement-group) to create one
                                per run.
                              properties:
                                strategy:
                                  description: 'strategy of the groups SCarpenter
                                    creates: cluster keeps the VMs close.'
                                  enum:
                                  - cluster
                                  type: string
                                use:
                                  description: |-
                                    use references an existing proximity placement group, which is never
                                    modified or deleted; the run key then only separates NodeClaims.
                                  properties:
                                    name:
                                      description: name of the proximity placement
                                        group.
                                      maxLength: 255
                                      minLength: 1
                                      type: string
                                  required:
                                  - name
                                  type: object
                              type: object
                              x-kubernetes-validations:
                              - message: set exactly one of strategy and use
                                rule: has(self.strategy) != has(self.use)
                          type: object
                        fake:
                          description: Placement is the fake block of a placement
                            profile.
                          properties:
                            group:
                              description: group is the fake placement construct nodes
                                join; it needs a run key.
                              properties:
                                strategy:
                                  description: strategy of the group.
                                  enum:
                                  - cluster
                                  - spread
                                  type: string
                              required:
                              - strategy
                              type: object
                          type: object
                        hcloud:
                          description: 'Placement is the Hetzner block of a placement
                            profile: a placement group.'
                          properties:
                            placementGroup:
                              description: |-
                                placementGroup is the placement construct nodes join; a group SCarpenter
                                creates needs a run key (label placement-group). A spread group holds
                                at most 10 servers.
                              properties:
                                type:
                                  description: type of the placement groups SCarpenter
                                    creates.
                                  enum:
                                  - spread
                                  type: string
                                use:
                                  description: |-
                                    use references an existing placement group, which is never modified or
                                    deleted; the run key then only separates NodeClaims.
                                  properties:
                                    name:
                                      description: name of the placement group.
                                      maxLength: 255
                                      minLength: 1
                                      type: string
                                  required:
                                  - name
                                  type: object
                              type: object
                              x-kubernetes-validations:
                              - message: set exactly one of type and use
