name: L4 (qemu)

# The L4 lane (docs/how-to-guides/testing.md#the-l4-lane): real Flatcar VMs with
# SCarpenter's Ignition join a k3s control plane in the privileged dev container.
# It runs on pull requests that touch what it tests, nightly, and on demand.
#
# Overview section 15, Q6: GitHub-hosted ubuntu-latest runners (4 vCPU, 16 GB, KVM
# through the udev rule below) are expected to run the lane in 10 to 15 minutes, but
# that has not been seen yet. The job is continue-on-error, so that it cannot block a
# pull request, until three green workflow_dispatch runs under 20 minutes are on
# record; then remove continue-on-error. The lane uses no credentials.
on:
  pull_request:
    paths:
      - pkg/bootstrap/**
      - pkg/vendors/qemu/**
      - test/qemu/**
      - test/lib.sh
      - hack/dev.sh
      - hack/devcontainer/**
      - config/rbac/**
      - .github/workflows/qemu.yml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: qemu-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qemu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Make /dev/kvm usable for the container's user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: ./.github/actions/dev-image

      - name: L4 (k3s, Headscale, flannel, kube-proxy, SCarpenter with the qemu driver, Flatcar VMs)
        run: hack/dev.sh --privileged make test-qemu

      - name: Upload the lane output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qemu-out
          path: test/qemu/.out/
          if-no-files-found: ignore

  # FALLBACK, kept as a comment: a self-hosted runner with /dev/kvm, if the hosted
  # runners cannot run the lane. It must be a SEPARATE job that never runs for pull
  # requests: a fork's pull request would run arbitrary code on the machine, and
  # GitHub advises against self-hosted runners for public repositories. Also set
  # "Require approval for all outside collaborators" for fork workflows in the
  # repository settings.
  #
  #  qemu-self-hosted:
  #    if: github.event_name != 'pull_request'
  #    runs-on: [self-hosted, linux, x64]
  #    timeout-minutes: 45
  #    steps:
  #      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
  #        with:
  #          persist-credentials: false
  #      - uses: ./.github/actions/dev-image
  #      - run: hack/dev.sh --privileged make test-qemu
