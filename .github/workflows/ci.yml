name: CI

# Runs the gates of docs/plans/v1/CONVENTIONS.md inside the dev container, the
# same way a developer does with hack/dev.sh. The dev image is built once per
# run (with a layer cache) and every step reuses it.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/dev-image

      - name: Generated code, CRDs, chart CRDs and RBAC, and API docs are up to date
        run: |
          hack/dev.sh make generate manifests chart-crds chart-rbac docs-api
          git add -N .
          git diff --exit-code

      - name: Lint (go vet, golangci-lint, actionlint, shellcheck, documentation links)
        run: hack/dev.sh make lint

      - name: Test (unit, golden, envtest)
        run: hack/dev.sh make test

      - name: Helm chart (lint, golden output, flags, RBAC and CRDs in sync)
        run: hack/dev.sh make test-chart

      - name: L5 without a cloud (manifests, sweeper, canary, planner, helpers; the lane itself runs in e2e.yml)
        run: hack/dev.sh make test-e2e-aws-dryrun

      - name: L5 of Alibaba Cloud without a cloud (manifests, sweeper, canary, helpers, policies)
        run: hack/dev.sh make test-e2e-alicloud-dryrun

      - name: Build the controller binary
        run: hack/dev.sh make build

      - name: Build the controller image and the development image
        run: hack/dev.sh make image image-dev

  # L3: SCarpenter with the fake driver in kind, installed from the Helm chart
  # (docs/how-to-guides/testing.md).
  kwok:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/dev-image

      - name: L3 (kind, kwok-controller, the controller with the fake driver)
        run: hack/dev.sh make test-kwok

      - name: Upload the lane output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kwok-out
          path: test/kwok/.out/
          if-no-files-found: ignore
