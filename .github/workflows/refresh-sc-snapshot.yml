name: Refresh Spare Cores snapshot

# Fetches the fixed set of Keeper API responses of
# test/data/sc-snapshot/queries.yaml with sc-keeper-go's fetcher and commits
# them to test/data/sc-snapshot (replacing the previous snapshot). Every other
# test job reads the committed snapshot, so test data only changes when this
# runs. Keeper's snapshot routes need an API key: the action keeper-key reads it
# from the parameter the repository variable KEEPER_API_KEY_PARAMETER names, with
# the CI role of the environment e2e (secret AWS_ROLE_ARN). The download is about
# 30 MB; it is manual only: run it rarely.
on:
  workflow_dispatch:

concurrency:
  group: refresh-sc-snapshot
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # the OIDC token the CI role is federated with (action keeper-key)

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: e2e
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: true

      - uses: ./.github/actions/dev-image

      # Fails with a clear message when the role or the variable is not set (a fork).
      - name: Keeper API key
        id: keeper
        uses: ./.github/actions/keeper-key
        with:
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          parameter-arn: ${{ vars.KEEPER_API_KEY_PARAMETER }}

      # sc-snapshot fails when the Keeper database changes during the fetch;
      # run the workflow again then.
      - name: Fetch the Keeper responses
        env:
          KEEPER_API_KEY_FILE: ${{ steps.keeper.outputs.file }}
        run: hack/dev.sh make snapshot

      - name: Commit if changed
        run: |
          git add -A test/data/sc-snapshot
          # The manifest always changes (fetched_at); only data changes count.
          if git diff --cached --quiet -- . ':(exclude)test/data/sc-snapshot/manifest.json'; then
            echo "Snapshot data unchanged, nothing to commit"
            exit 0
          fi
          db_hash=$(python3 -c 'import json; m=json.load(open("test/data/sc-snapshot/manifest.json")); print(m["keeper"]["database_hash"][:12], m["keeper"]["database_last_updated"])')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh Spare Cores snapshot (Keeper database ${db_hash})"
          git push
