name: L5 sweeper (Alibaba Cloud e2e)

# Deletes what the L5 lane (e2e-cloud.yml, vendor alicloud) left behind in the account when a
# run died or was cancelled before its teardown: instances, deployment sets, security
# groups, vSwitches and VPCs of every cluster named scarpenter-ci-* that is older than two
# hours, in the lane's region (ALICLOUD_REGION). The selection logic is
# pkg/vendors/alicloud/sweep (tested against the Alibaba Cloud driver's in-memory ECS and
# VPC); docs/how-to-guides/testing.md#the-l5-lane describes the tag it reads. Same role as the
# lane, but its own environment, e2e-sweeper: limited to main and without reviewers, so that a
# scheduled sweep never waits for an approval, and a manual run from another branch (whose
# code would hold the role without a review) is refused. The role's trust policy lists the
# OIDC subject of both environments. The credentials are the OIDC token of the job written to
# a file (test/e2e-alicloud/oidc-token.sh: no third-party action), which the sweeper's
# credentials library exchanges for the RAM role. In the environment: the secrets
# ALICLOUD_ROLE_ARN and ALICLOUD_OIDC_PROVIDER_ARN, the variables ALICLOUD_REGION and
# ALICLOUD_OIDC_AUDIENCE. The lane has not run yet.
on:
  schedule:
    - cron: "37 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be deleted"
        default: false
        type: boolean
      max_age:
        description: "Minimum age of what is deleted (a Go duration)"
        default: 2h
        type: string
      regions:
        description: "Regions to sweep: a comma list, or all (default: the lane's region)"
        default: ""
        type: string

# One sweep at a time, and not while a lane run is tearing down (the age limit keeps it
# away from a running one anyway).
concurrency:
  group: e2e-alicloud-sweeper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    if: github.repository == 'SpareCores/scarpenter'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: e2e-sweeper
    permissions:
      contents: read
      id-token: write
    env:
      ALICLOUD_REGION: ${{ vars.ALICLOUD_REGION || 'ap-southeast-1' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false # a privileged job restores no cache

      - name: Write the OIDC token for the CI role
        env:
          ALICLOUD_ROLE_ARN: ${{ secrets.ALICLOUD_ROLE_ARN }}
          ALICLOUD_OIDC_PROVIDER_ARN: ${{ secrets.ALICLOUD_OIDC_PROVIDER_ARN }}
          ALICLOUD_OIDC_AUDIENCE: ${{ vars.ALICLOUD_OIDC_AUDIENCE || 'sts.aliyuncs.com' }}
          ALICLOUD_SESSION_NAME: scarpenter-ci-sweeper
        run: test/e2e-alicloud/oidc-token.sh

      - name: Sweep
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_MAX_AGE: ${{ inputs.max_age }}
          INPUT_REGIONS: ${{ inputs.regions }}
        run: |
          # Not below two hours: a lane run may take 90 minutes, and its resources must never
          # look old enough to sweep while it runs.
          age="${INPUT_MAX_AGE:-2h}"
          if ! [[ "${age}" =~ ^(([2-9]|[1-9][0-9]+)h|(1[2-9][0-9]|[2-9][0-9]{2}|[1-9][0-9]{3,})m)$ ]]; then
            echo "::error::max_age must be at least 2h (a Go duration in whole hours or minutes)"; exit 1
          fi
          args=(-max-age "${age}" -regions "${INPUT_REGIONS:-${ALICLOUD_REGION}}" -home-region "${ALICLOUD_REGION}")
          if [ "${INPUT_DRY_RUN}" = "true" ]; then args+=(-dry-run); fi
          go run ./test/e2e-alicloud/sweeper "${args[@]}"
