name: L5 sweeper (OVH e2e)

# Deletes what the L5 lane (e2e-cloud.yml, vendor ovh) left behind in the Public Cloud project when a
# run died or was cancelled before its teardown: servers, security groups and server groups of every
# cluster named scarpenter-ci-* that is older than two hours, in the lane's region (OVH_REGION: the
# only one activated in the lane's project). Never images. The selection logic is
# pkg/vendors/ovh/sweep (tested against the OVH driver's in-memory OpenStack);
# docs/how-to-guides/testing.md#the-l5-lane describes what it reads. The same OpenStack user as the
# lane, but its own environment, e2e-sweeper: limited to main and without reviewers, so that a
# scheduled sweep never waits for an approval, and a manual run from another branch (whose code
# would hold the credentials without a review) is refused.
on:
  schedule:
    - cron: "47 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be deleted"
        default: false
        type: boolean
      max_age:
        description: "Minimum age of what is deleted (a Go duration)"
        default: 2h
        type: string
      regions:
        description: "Regions to sweep: a comma list of catalog names, or all (default: the lane's region)"
        default: ""
        type: string

# One sweep at a time, and not while a lane run is tearing down (the age limit keeps it
# away from a running one anyway).
concurrency:
  group: e2e-ovh-sweeper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    if: github.repository == 'SpareCores/scarpenter'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: e2e-sweeper
    permissions:
      contents: read
    env:
      OS_AUTH_URL: ${{ vars.OVH_AUTH_URL || 'https://auth.cloud.ovh.net/v3' }}
      OS_PROJECT_ID: ${{ vars.OVH_PROJECT_ID }}
      OS_USER_DOMAIN_NAME: Default
      OVH_REGION: ${{ vars.OVH_REGION || 'GRA11' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false # a privileged job restores no cache

      - name: Sweep
        env:
          OS_USERNAME: ${{ secrets.OVH_OS_USERNAME }}
          OS_PASSWORD: ${{ secrets.OVH_OS_PASSWORD }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_MAX_AGE: ${{ inputs.max_age }}
          INPUT_REGIONS: ${{ inputs.regions }}
        run: |
          # Not below two hours: a lane run may take 90 minutes, and its resources must never
          # look old enough to sweep while it runs.
          age="${INPUT_MAX_AGE:-2h}"
          if ! [[ "${age}" =~ ^(([2-9]|[1-9][0-9]+)h|(1[2-9][0-9]|[2-9][0-9]{2}|[1-9][0-9]{3,})m)$ ]]; then
            echo "::error::max_age must be at least 2h (a Go duration in whole hours or minutes)"; exit 1
          fi
          args=(-max-age "${age}" -regions "${INPUT_REGIONS:-${OVH_REGION}}")
          if [ "${INPUT_DRY_RUN}" = "true" ]; then args+=(-dry-run); fi
          go run ./test/e2e-ovh/sweeper "${args[@]}"
