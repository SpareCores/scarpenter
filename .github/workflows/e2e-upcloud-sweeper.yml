name: L5 sweeper (UpCloud e2e)

# Deletes what the L5 lane (e2e-cloud.yml, vendor upcloud) left behind in the account when a
# run died or was cancelled before its teardown: servers (stopped, then deleted with their
# disks), server groups, SDN rulesets and networks and unattached disks of every cluster
# named scarpenter-ci-* that is older than two hours. UpCloud has no regions: one account-wide
# call covers every zone. The selection logic is pkg/vendors/upcloud/sweep (tested against the
# UpCloud driver's in-memory fake); docs/how-to-guides/testing.md#the-l5-lane describes the
# label it reads. Same sub-account token as the lane, but its own environment, e2e-sweeper:
# limited to main and without reviewers, so that a scheduled sweep never waits for an
# approval, and a manual run from another branch (whose code would hold the token without a
# review) is refused. Resources labelled scarpenter-use (the Flatcar templates) are never
# touched.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be deleted"
        default: false
        type: boolean
      max_age:
        description: "Minimum age of what is deleted (a Go duration)"
        default: 2h
        type: string

# One sweep at a time, and not while a lane run is tearing down (the age limit keeps it
# away from a running one anyway).
concurrency:
  group: e2e-upcloud-sweeper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    if: github.repository == 'SpareCores/scarpenter'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: e2e-sweeper
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false # a privileged job restores no cache

      - name: Sweep
        env:
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_MAX_AGE: ${{ inputs.max_age }}
        run: |
          # Not below two hours: a lane run may take 90 minutes, and its resources must never
          # look old enough to sweep while it runs.
          age="${INPUT_MAX_AGE:-2h}"
          if ! [[ "${age}" =~ ^(([2-9]|[1-9][0-9]+)h|(1[2-9][0-9]|[2-9][0-9]{2}|[1-9][0-9]{3,})m)$ ]]; then
            echo "::error::max_age must be at least 2h (a Go duration in whole hours or minutes)"; exit 1
          fi
          [[ -n "${UPCLOUD_TOKEN}" ]] || { echo "::error::the environment secret UPCLOUD_TOKEN is not set"; exit 1; }
          args=(-max-age "${age}")
          if [ "${INPUT_DRY_RUN}" = "true" ]; then args+=(-dry-run); fi
          go run ./test/e2e-upcloud/sweeper "${args[@]}"
