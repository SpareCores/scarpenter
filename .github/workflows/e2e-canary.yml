name: L5 canary

# The free check that the outside world still matches what the real-cloud lanes pin
# (docs/how-to-guides/testing-and-releasing.md#the-canary): the images, the quotas, the
# instance types, the sysext and k3s releases. No instance, no cluster, no Tailscale; the
# credentials are a READ-ONLY role (test/e2e-aws/canary-policy.sh prints its policy) in the
# environment e2e-canary, which can be limited to main (a schedule runs from the default
# branch). Nightly, and on demand. A failed nightly run opens or updates the one issue
# labelled e2e-canary, with the redacted table; a green run closes it.
#
# Provisioned outside this repository: the environment e2e-canary with the secret
# AWS_ROLE_ARN (the read-only role, trusted for this repository's OIDC subject of the
# environment) and the variable AWS_REGION (optional, default us-east-2); for hcloud the secret
# HCLOUD_TOKEN (a read-only token of the CI project) and the optional variable E2E_HCLOUD_LOCATIONS.
# For OVH: the secrets OVH_OS_CANARY_USERNAME and OVH_OS_CANARY_PASSWORD (a read-only OpenStack
# user of the lane's project) and the variables OVH_PROJECT_ID and OVH_REGION (optional, default GRA11).
# The Vultr canary (once vultr is a line of test/e2e-vendors.txt) needs the environment secret
# VULTR_API_KEY, the key of a second sub-user with read access only (its IP allowlist must admit
# the runners), and the variable VULTR_REGION (optional, default ewr). The pinned Flatcar version
# and the plans are the lane's (test/e2e-vultr/defaults.sh).
# environment) and the variable AWS_REGION (optional, default us-east-2). For Alibaba Cloud:
# the secrets ALICLOUD_ROLE_ARN (a read-only RAM role, test/e2e-alicloud/canary-policy.sh) and
# ALICLOUD_OIDC_PROVIDER_ARN, the variables ALICLOUD_REGION (default ap-southeast-1) and
# ALICLOUD_OIDC_AUDIENCE.
# For the vendor gcp: the
# variables GCP_PROJECT and GCP_REGION (optional, default us-central1) and the secrets
# GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT (the read-only role of
# test/e2e-gcp/canary-policy.sh; federated, no key file).
# For the vendor oci: the variables OCI_COMPARTMENT, OCI_TENANCY, OCI_REGION (optional, default
# eu-frankfurt-1), OCI_HOME_REGION (optional), OCI_IDENTITY_DOMAIN_URL, OCI_CLIENT_ID and
# OCI_OIDC_AUDIENCE, and the secret OCI_CLIENT_SECRET: an identity domain application whose trust names
# the environment e2e-canary and whose group holds the read-only policy of test/e2e-oci/canary-policy.sh.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      vendor:
        description: "Vendor (a line of test/e2e-vendors.txt) or all"
        default: all
        type: string

concurrency:
  group: e2e-canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    if: github.repository == 'SpareCores/scarpenter'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Vendors
        id: plan
        env:
          INPUT_VENDOR: ${{ inputs.vendor }}
        run: test/e2e-plan.sh vendors "${INPUT_VENDOR:-all}" | tee -a "${GITHUB_OUTPUT}"

  canary:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: e2e-canary
    permissions:
      contents: read
      id-token: write # the OIDC token the read-only role is federated with
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      E2E_VENDOR: ${{ matrix.vendor }}
      VAR_AWS_REGION: ${{ vars.AWS_REGION }}
      VAR_HCLOUD_LOCATIONS: ${{ vars.E2E_HCLOUD_LOCATIONS }}
      VAR_OVH_REGION: ${{ vars.OVH_REGION }}
      VAR_OVH_PROJECT_ID: ${{ vars.OVH_PROJECT_ID }}
      VAR_OVH_AUTH_URL: ${{ vars.OVH_AUTH_URL }}
      VAR_VULTR_REGION: ${{ vars.VULTR_REGION }}
      VAR_ALICLOUD_REGION: ${{ vars.ALICLOUD_REGION }}
      VAR_UPCLOUD_ZONE: ${{ vars.UPCLOUD_ZONE }}
      VAR_AZURE_REGION: ${{ vars.AZURE_REGION }}
      # Azure: IDs, not secrets (the read-only identity is federated with this environment).
      VAR_AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      VAR_AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      VAR_AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      VAR_GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      VAR_GCP_REGION: ${{ vars.GCP_REGION }}
      VAR_OCI_REGION: ${{ vars.OCI_REGION }}
      VAR_OCI_HOME_REGION: ${{ vars.OCI_HOME_REGION }}
      VAR_OCI_COMPARTMENT: ${{ vars.OCI_COMPARTMENT }}
      VAR_OCI_TENANCY: ${{ vars.OCI_TENANCY }}
      VAR_OCI_IDENTITY_DOMAIN_URL: ${{ vars.OCI_IDENTITY_DOMAIN_URL }}
      VAR_OCI_CLIENT_ID: ${{ vars.OCI_CLIENT_ID }}
      VAR_OCI_OIDC_AUDIENCE: ${{ vars.OCI_OIDC_AUDIENCE }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false # a job with a cloud role restores no cache

      - name: Region
        run: |
          case "${E2E_VENDOR}" in
            aws) echo "AWS_REGION=${VAR_AWS_REGION:-us-east-2}" >> "${GITHUB_ENV}" ;;
            hcloud) echo "E2E_HCLOUD_LOCATIONS=${VAR_HCLOUD_LOCATIONS:-fsn1,nbg1,hel1}" >> "${GITHUB_ENV}" ;;
            ovh)
              [[ -z "${VAR_OVH_REGION}" || "${VAR_OVH_REGION}" =~ ^[A-Za-z0-9-]+$ ]] || { echo "::error::OVH_REGION" >&2; exit 1; }
              [[ -z "${VAR_OVH_PROJECT_ID}" || "${VAR_OVH_PROJECT_ID}" =~ ^[0-9a-f]{32}$ ]] || { echo "::error::OVH_PROJECT_ID" >&2; exit 1; }
              [[ -z "${VAR_OVH_AUTH_URL}" || "${VAR_OVH_AUTH_URL}" =~ ^https://[A-Za-z0-9./-]+$ ]] || { echo "::error::OVH_AUTH_URL" >&2; exit 1; }
              {
                echo "OS_REGION_NAME=${VAR_OVH_REGION:-GRA11}"
                echo "OS_PROJECT_ID=${VAR_OVH_PROJECT_ID}"
                echo "OS_AUTH_URL=${VAR_OVH_AUTH_URL:-https://auth.cloud.ovh.net/v3}"
                echo "OS_USER_DOMAIN_NAME=Default"
              } >> "${GITHUB_ENV}"
              ;;
            vultr) echo "VULTR_REGION=${VAR_VULTR_REGION:-ewr}" >> "${GITHUB_ENV}" ;;
            alicloud) echo "ALICLOUD_REGION=${VAR_ALICLOUD_REGION:-ap-southeast-1}" >> "${GITHUB_ENV}" ;;
            upcloud) echo "UPCLOUD_ZONE=${VAR_UPCLOUD_ZONE:-fi-hel1}" >> "${GITHUB_ENV}" ;;
            azure)
              guid='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
              for v in CLIENT_ID TENANT_ID SUBSCRIPTION_ID; do
                x="VAR_AZURE_${v}"
                [[ "${!x}" =~ ${guid} ]] || { echo "::error::the variable AZURE_${v} must be a GUID" >&2; exit 1; }
                echo "AZURE_${v}=${!x}" >> "${GITHUB_ENV}"
              done
              [[ "${VAR_AZURE_REGION:-westeurope}" =~ ^[a-z0-9]+$ ]] || { echo "::error::the variable AZURE_REGION is not a region name" >&2; exit 1; }
              echo "AZURE_REGION=${VAR_AZURE_REGION:-westeurope}" >> "${GITHUB_ENV}"
              ;;
            gcp)
              [[ "${VAR_GCP_PROJECT}" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]] || { echo "::error::the variable GCP_PROJECT must be a project id" >&2; exit 1; }
              [[ -z "${VAR_GCP_REGION}" || "${VAR_GCP_REGION}" =~ ^[a-z]+(-[a-z]+)*[0-9]+$ ]] || { echo "::error::the variable GCP_REGION must look like us-central1" >&2; exit 1; }
              echo "GCP_PROJECT=${VAR_GCP_PROJECT}" >> "${GITHUB_ENV}"
              echo "GCP_REGION=${VAR_GCP_REGION:-us-central1}" >> "${GITHUB_ENV}"
              ;;
            oci)
              # OCIDs, a region and a URL go into the environment: only their shapes are accepted.
              [[ "${VAR_OCI_COMPARTMENT}" =~ ^ocid1\.compartment\.oc[0-9]+\.[a-z0-9-]*\.[A-Za-z0-9]+$ ]] || { echo "::error::the variable OCI_COMPARTMENT must be a compartment OCID" >&2; exit 1; }
              [[ "${VAR_OCI_TENANCY}" =~ ^ocid1\.tenancy\.oc[0-9]+\.[a-z0-9-]*\.[A-Za-z0-9]+$ ]] || { echo "::error::the variable OCI_TENANCY must be a tenancy OCID" >&2; exit 1; }
              [[ -z "${VAR_OCI_REGION}" || "${VAR_OCI_REGION}" =~ ^[a-z]{2}(-[a-z]+)+-[0-9]+$ ]] || { echo "::error::the variable OCI_REGION must look like eu-frankfurt-1" >&2; exit 1; }
              [[ -z "${VAR_OCI_HOME_REGION}" || "${VAR_OCI_HOME_REGION}" =~ ^[a-z]{2}(-[a-z]+)+-[0-9]+$ ]] || { echo "::error::the variable OCI_HOME_REGION must look like eu-frankfurt-1" >&2; exit 1; }
              [[ "${VAR_OCI_IDENTITY_DOMAIN_URL}" =~ ^https://idcs-[a-f0-9]+\.identity\.[a-z.]*oraclecloud\.com$ ]] || { echo "::error::the variable OCI_IDENTITY_DOMAIN_URL must be the identity domain's URL" >&2; exit 1; }
              [[ "${VAR_OCI_CLIENT_ID}" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "::error::the variable OCI_CLIENT_ID must be set" >&2; exit 1; }
              [[ -z "${VAR_OCI_OIDC_AUDIENCE}" || "${VAR_OCI_OIDC_AUDIENCE}" =~ ^[A-Za-z0-9:/._-]+$ ]] || { echo "::error::the variable OCI_OIDC_AUDIENCE has characters it must not" >&2; exit 1; }
              {
                echo "OCI_COMPARTMENT=${VAR_OCI_COMPARTMENT}"
                echo "OCI_TENANCY=${VAR_OCI_TENANCY}"
                echo "OCI_REGION=${VAR_OCI_REGION:-eu-frankfurt-1}"
                echo "OCI_HOME_REGION=${VAR_OCI_HOME_REGION:-${VAR_OCI_REGION:-eu-frankfurt-1}}"
                echo "OCI_IDENTITY_DOMAIN_URL=${VAR_OCI_IDENTITY_DOMAIN_URL}"
                echo "OCI_CLIENT_ID=${VAR_OCI_CLIENT_ID}"
                echo "OCI_OIDC_AUDIENCE=${VAR_OCI_OIDC_AUDIENCE:-oci-federation}"
              } >> "${GITHUB_ENV}"
              ;;
          esac

      - name: Assume the read-only role (aws)
        if: matrix.vendor == 'aws'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
          role-session-name: scarpenter-canary-${{ github.run_id }}

      # A READ-ONLY token of the CI project (created as such in the Console), the secret
      # HCLOUD_TOKEN of the environment e2e-canary; the canary's transport refuses every method but GET too.
      - name: The read-only token (hcloud)
        if: matrix.vendor == 'hcloud'
        env:
          HCLOUD_TOKEN_SECRET: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          [ -n "${HCLOUD_TOKEN_SECRET}" ] || { echo "::error::the environment secret HCLOUD_TOKEN is not set"; exit 1; }
          echo "::add-mask::${HCLOUD_TOKEN_SECRET}"
          echo "HCLOUD_TOKEN=${HCLOUD_TOKEN_SECRET}" >> "${GITHUB_ENV}"

      # A second, read-only OpenStack user of the lane's project (the Infrastructure Supervisor
      # role: it lists flavors, networks, images and servers, and changes nothing; the driver
      # of the canary sits behind a guard that refuses writes as well).
      - name: OpenStack read-only credentials (ovh)
        if: matrix.vendor == 'ovh'
        env:
          OVH_OS_USERNAME: ${{ secrets.OVH_OS_CANARY_USERNAME }}
          OVH_OS_PASSWORD: ${{ secrets.OVH_OS_CANARY_PASSWORD }}
        run: |
          [[ -n "${OVH_OS_USERNAME}" && -n "${OVH_OS_PASSWORD}" ]] || { echo "::error::the secrets OVH_OS_CANARY_USERNAME and OVH_OS_CANARY_PASSWORD are not set in the environment e2e-canary" >&2; exit 1; }
          [[ "${OVH_OS_USERNAME}${OVH_OS_PASSWORD}" != *$'\n'* ]] || { echo "::error::a credential contains a newline" >&2; exit 1; }
          echo "::add-mask::${OVH_OS_PASSWORD}"
          {
            echo "OS_USERNAME=${OVH_OS_USERNAME}"
            echo "OS_PASSWORD=${OVH_OS_PASSWORD}"
          } >> "${GITHUB_ENV}"

      # Vultr has no OIDC for callers: a read-only sub-user's key (the canary's guard refuses
      # every non-read call as well).
      - name: Read-only API key (vultr)
        if: matrix.vendor == 'vultr'
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
        run: |
          [ -n "${VULTR_API_KEY}" ] || { echo "::error::the environment secret VULTR_API_KEY is not set" >&2; exit 1; }
          echo "VULTR_API_KEY=${VULTR_API_KEY}" >> "${GITHUB_ENV}"
      # No third-party action: the OIDC token goes to a file and the read-only role is named in
      # the environment; the credentials library of the canary assumes it (test/e2e-alicloud/oidc-token.sh).
      - name: Write the OIDC token for the read-only role (alicloud)
        if: matrix.vendor == 'alicloud'
        env:
          ALICLOUD_ROLE_ARN: ${{ secrets.ALICLOUD_ROLE_ARN }}
          ALICLOUD_OIDC_PROVIDER_ARN: ${{ secrets.ALICLOUD_OIDC_PROVIDER_ARN }}
          ALICLOUD_OIDC_AUDIENCE: ${{ vars.ALICLOUD_OIDC_AUDIENCE || 'sts.aliyuncs.com' }}
          ALICLOUD_SESSION_NAME: scarpenter-canary-${{ github.run_id }}
        run: test/e2e-alicloud/oidc-token.sh
      # UpCloud: the API token of the CI sub-account (the secret UPCLOUD_TOKEN of the
      # environment e2e-canary; a token cannot be made read-only, the canary's guard
      # refuses every write: test/canary/upcloud_guard.go).
      - name: Export the API token (upcloud)
        if: matrix.vendor == 'upcloud'
        env:
          UPCLOUD_TOKEN_IN: ${{ secrets.UPCLOUD_TOKEN }}
        run: |
          [[ -n "${UPCLOUD_TOKEN_IN}" ]] || { echo "::error::the environment secret UPCLOUD_TOKEN is not set" >&2; exit 1; }
          echo "::add-mask::${UPCLOUD_TOKEN_IN}"
          echo "UPCLOUD_TOKEN=${UPCLOUD_TOKEN_IN}" >> "${GITHUB_ENV}"
      # Azure: the read-only identity through GitHub's OIDC. The canary's own Go code reads the
      # federated token file (the driver's workload identity chain), which a background loop
      # keeps fresh for the length of the job; the az session is for anything the script shells to.
      - name: Log in with the read-only identity (azure)
        if: matrix.vendor == 'azure'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Federated token for the canary (azure)
        if: matrix.vendor == 'azure'
        run: |
          test/e2e-azure/azure-token.sh start "${RUNNER_TEMP}/azure-token"
          echo "AZURE_FEDERATED_TOKEN_FILE=${RUNNER_TEMP}/azure-token" >> "${GITHUB_ENV}"

      - name: Authenticate to Google Cloud with the read-only identity (gcp)
        if: matrix.vendor == 'gcp'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT }}
          create_credentials_file: true
          export_environment_variables: true

      # Oracle Cloud: the read-only identity through the keyless token exchange (test/e2e-oci/oci-session.sh). The
      # canary's Go code reads the token file (the driver's workload identity federation mode), which a background
      # loop keeps fresh for the length of the job; it needs no CLI. The canary's guard refuses every write as well.
      - name: Start the OCI session with the read-only identity (oci)
        if: matrix.vendor == 'oci'
        env:
          OCI_CLIENT_SECRET: ${{ secrets.OCI_CLIENT_SECRET }}
        run: |
          [[ -n "${OCI_CLIENT_SECRET}" ]] || { echo "::error::the environment secret OCI_CLIENT_SECRET is not set in the environment e2e-canary" >&2; exit 1; }
          test/e2e-oci/oci-session.sh start "${RUNNER_TEMP}/oci-session"

      # The output is redacted by the script (the job log, the artifact and the issue are public).
      - name: Canary
        run: |
          set -o pipefail
          mkdir -p out
          test/canary/run.sh "${E2E_VENDOR}" | tee "out/canary-${E2E_VENDOR}.txt"

      # The renewal loop ends and the key, the tokens and the client secret are removed.
      - name: End the OCI session (oci)
        if: always() && matrix.vendor == 'oci'
        run: test/e2e-oci/oci-session.sh stop "${RUNNER_TEMP}/oci-session"

      - name: Summary
        if: always()
        run: |
          [ -f "out/canary-${E2E_VENDOR}.txt" ] && { echo "### Canary ${E2E_VENDOR}"; echo '```'; cat "out/canary-${E2E_VENDOR}.txt"; echo '```'; } >> "${GITHUB_STEP_SUMMARY}"
          true

      - name: Keep the table for the issue
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-${{ matrix.vendor }}
          path: out/
          retention-days: 3
          if-no-files-found: ignore

  # No cloud credentials here: only the issue.
  issue:
    needs: canary
    # Cancelled or skipped runs say nothing; scheduled runs only (a manual run is watched).
    if: always() && github.event_name == 'schedule' && (needs.canary.result == 'failure' || needs.canary.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RESULT: ${{ needs.canary.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.canary.result == 'failure'
        continue-on-error: true # no table when the job died before it wrote one
        with:
          pattern: canary-*
          path: tables
          merge-multiple: true

      - name: Open, update or close the issue
        run: |
          label=e2e-canary
          open="$(gh issue list --label "${label}" --state open --json number --jq '.[0].number // empty')"
          if [[ "${RESULT}" == success ]]; then
            if [[ -n "${open}" ]]; then
              gh issue close "${open}" --comment "The canary is green again: ${RUN_URL}"
            fi
            exit 0
          fi
          {
            echo "The nightly canary failed: ${RUN_URL}"
            echo
            for f in tables/*.txt; do
              [[ -f "${f}" ]] || continue
              echo "#### $(basename "${f}" .txt)"
              echo '```'
              head -c 20000 "${f}"
              echo '```'
            done
            echo
            echo "What to do: docs/how-to-guides/testing-and-releasing.md#the-canary"
          } > body.md
          if [[ -n "${open}" ]]; then
            gh issue comment "${open}" --body-file body.md
          else
            gh label create "${label}" --color B60205 --description "The nightly real-cloud canary failed" 2>/dev/null || true
            gh issue create --title "L5 canary failed: the outside world moved" --label "${label}" --body-file body.md
          fi
