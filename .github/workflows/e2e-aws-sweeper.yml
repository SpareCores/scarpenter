name: L5 sweeper (AWS e2e)

# Deletes what the L5 lane (e2e-aws.yml) left behind in the account when a run died or
# was cancelled before its teardown: instances, placement groups, security groups and
# the managed network of every cluster named scarpenter-ci-* that is older than two
# hours, in every enabled region. The selection logic is pkg/vendors/aws/sweep (tested
# against the AWS driver's in-memory EC2); docs/how-to-guides/testing.md#the-l5-lane
# describes the tag it reads. Same environment and role as the lane.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be deleted"
        default: false
        type: boolean
      max_age:
        description: "Minimum age of what is deleted (a Go duration)"
        default: 2h
        type: string

# One sweep at a time, and not while a lane run is tearing down (the age limit keeps it
# away from a running one anyway).
concurrency:
  group: e2e-aws-sweeper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    if: github.repository == 'SpareCores/scarpenter'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: e2e
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false # a privileged job restores no cache

      - name: Assume the CI role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
          role-session-name: scarpenter-ci-sweeper

      - name: Sweep
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_MAX_AGE: ${{ inputs.max_age }}
        run: |
          # Not below two hours: a lane run may take 90 minutes, and its resources must never
          # look old enough to sweep while it runs.
          age="${INPUT_MAX_AGE:-2h}"
          if ! [[ "${age}" =~ ^(([2-9]|[1-9][0-9]+)h|(1[2-9][0-9]|[2-9][0-9]{2}|[1-9][0-9]{3,})m)$ ]]; then
            echo "::error::max_age must be at least 2h (a Go duration in whole hours or minutes)"; exit 1
          fi
          args=(-max-age "${age}")
          if [ "${INPUT_DRY_RUN}" = "true" ]; then args+=(-dry-run); fi
          go run ./test/e2e-aws/sweeper "${args[@]}"
