name: L5 (cloud e2e)

# One vendor's real-cloud run (the L5 lane, docs/how-to-guides/testing.md#the-l5-lane;
# when it runs and why: docs/how-to-guides/testing-and-releasing.md): SCarpenter on a real
# cloud with a k3s control plane on this runner and the nodes joining over Tailscale. It
# costs money (a full AWS run: under $0.20, about 22 minutes; the job limit is 90) and
# needs credentials, so it is only called from e2e.yml (pull requests that touch what the
# lane tests, manual runs) and release.yml (every tag), never by itself.
#
# What differs per vendor lives in test/e2e-<vendor>/ (the scripts, the pins in
# defaults.sh, the CI policy) and in the vendor's credential step below; everything else
# is shared. Provisioned outside this repository (docs/how-to-guides/testing.md lists the
# prerequisites): the environment e2e (required reviewers: a human approves every run), the
# variables TS_OAUTH_CLIENT_ID, TS_AUDIENCE and AWS_REGION (a Tailscale federated identity
# for GitHub Actions: no stored secret), the environment secret AWS_ROLE_ARN, the IAM role
# (which also allows ssm:GetParameter on the parameter of the Keeper API key, named by the
# repository variable KEEPER_API_KEY_PARAMETER; optional) and the tailnet's ACL. For OVH
# (vendor ovh): the variables OVH_PROJECT_ID, OVH_REGION (a
# Keystone catalog name, default GRA11) and optionally OVH_AUTH_URL, and the environment secrets
# OVH_OS_USERNAME and OVH_OS_PASSWORD of a dedicated OpenStack user of the lane's own Public
# Cloud project (one active region, low quotas); OVH documents no GitHub OIDC trust, so the
# password is a stored secret.
# For the vendor gcp (a dedicated project): the variables GCP_PROJECT and
# GCP_REGION and the environment secrets GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT (a
# workload identity pool and provider for GitHub, and the service account with the CI roles of
# test/e2e-gcp/ci-policy.sh; no key file). The sweeper (e2e-<vendor>-sweeper.yml) deletes what a run that
# died left behind.
# Alibaba Cloud (alicloud): the variables ALICLOUD_REGION and ALICLOUD_OIDC_AUDIENCE and the
# environment secrets ALICLOUD_ROLE_ARN and ALICLOUD_OIDC_PROVIDER_ARN (a RAM role assumed
# through a RAM OIDC identity provider; the lane has not run yet).
# Oracle Cloud (oci): the variables OCI_COMPARTMENT and OCI_TENANCY (OCIDs of the lane's dedicated
# compartment and of the tenancy), OCI_REGION (default eu-frankfurt-1), OCI_HOME_REGION (optional),
# OCI_IDENTITY_DOMAIN_URL, OCI_CLIENT_ID and OCI_OIDC_AUDIENCE (the identity domain and its confidential
# application that trust GitHub's OIDC token), and the environment secret OCI_CLIENT_SECRET (the
# application's client secret: the one stored secret; no API key exists). The identity is the keyless
# token exchange of test/e2e-oci/oci-session.sh (the lane has not run yet).
on:
  workflow_call:
    inputs:
      vendor:
        description: "The vendor of the lane: a line of test/e2e-vendors.txt (aws, alicloud)"
        required: true
        type: string
      mode:
        description: "full: every scenario (or the list below); smoke: E2E_SMOKE_SCENARIOS of the vendor's defaults.sh"
        required: false
        default: full
        type: string
      scenarios:
        description: "Scenarios to run, comma separated, or all; overrides the mode's set when given"
        required: false
        default: ""
        type: string
      fail_fast:
        description: "Skip the remaining scenarios after the first failure, so that the diagnostics and the teardown start at once"
        required: false
        default: true
        type: boolean
      k3s_version:
        description: "k3s release of the control plane (empty: the pin of defaults.sh); v1.31.x+k3s1 with kubernetes_version for the minimum-version run"
        required: false
        default: ""
        type: string
      kubernetes_version:
        description: "Kubernetes version of the nodes' kubelet sysext (empty: the pin); at most the API server's, at least three minors below it"
        required: false
        default: ""
        type: string
      local_storage_type:
        description: "Optional: an instance type with instance-store disks for the local-storage scenario"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  e2e:
    # Not in forks that enable Actions: they have no environment, secrets or role.
    if: github.repository == 'SpareCores/scarpenter'
    name: e2e (${{ inputs.vendor }}, ${{ inputs.mode }})
    runs-on: ubuntu-latest
    # One run per vendor at a time (the account's quotas are shared, and so is the
    # tailnet's ACL budget; the quota scenario compares the controller's usage with every
    # instance of the account, so two runs at once would fail it); the next waits. A run that
    # is still waiting is replaced by a newer one: GitHub keeps one pending run per group,
    # and that includes a waiting release gate (re-run its failed jobs).
    concurrency:
      group: e2e-${{ inputs.vendor }}
      cancel-in-progress: false
    # Full: 90 minutes: setup (up to 15), the scenarios (their own limit below) and at least
    # 20 minutes that stay for the diagnostics and the teardown. Smoke has two scenarios and
    # a shorter limit for all of it.
    timeout-minutes: ${{ inputs.mode == 'smoke' && 60 || 90 }}
    environment: e2e
    permissions:
      contents: read
      id-token: write # the OIDC tokens the cloud role and the Tailscale identity are federated with
    env:
      TS_OAUTH_CLIENT_ID: ${{ vars.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ vars.TS_AUDIENCE }}
      E2E_VENDOR: ${{ inputs.vendor }}
      E2E_MODE: ${{ inputs.mode }}
      E2E_CLUSTER: scarpenter-ci-${{ github.run_id }}
      E2E_RUN_ID: ${{ github.run_id }}
      # The vendor's region variable is read in the Prepare step.
      VAR_AWS_REGION: ${{ vars.AWS_REGION }}
      VAR_HCLOUD_LOCATIONS: ${{ vars.E2E_HCLOUD_LOCATIONS }}
      VAR_OVH_REGION: ${{ vars.OVH_REGION }}
      VAR_OVH_PROJECT_ID: ${{ vars.OVH_PROJECT_ID }}
      VAR_OVH_AUTH_URL: ${{ vars.OVH_AUTH_URL }}
      VAR_VULTR_REGION: ${{ vars.VULTR_REGION }}
      VAR_ALICLOUD_REGION: ${{ vars.ALICLOUD_REGION }}
      VAR_UPCLOUD_ZONE: ${{ vars.UPCLOUD_ZONE }}
      VAR_AZURE_REGION: ${{ vars.AZURE_REGION }}
      # Azure (variables, not secrets: IDs only; the identity is federated, no secret anywhere).
      VAR_AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      VAR_AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      VAR_AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      VAR_AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      VAR_GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      VAR_GCP_REGION: ${{ vars.GCP_REGION }}
      # OCI: OCIDs, a region and the identity domain's address and client (variables; the client secret is
      # the environment secret read by the session step only).
      VAR_OCI_REGION: ${{ vars.OCI_REGION }}
      VAR_OCI_HOME_REGION: ${{ vars.OCI_HOME_REGION }}
      VAR_OCI_COMPARTMENT: ${{ vars.OCI_COMPARTMENT }}
      VAR_OCI_TENANCY: ${{ vars.OCI_TENANCY }}
      VAR_OCI_IDENTITY_DOMAIN_URL: ${{ vars.OCI_IDENTITY_DOMAIN_URL }}
      VAR_OCI_CLIENT_ID: ${{ vars.OCI_CLIENT_ID }}
      VAR_OCI_OIDC_AUDIENCE: ${{ vars.OCI_OIDC_AUDIENCE }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Prepare
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_K3S_VERSION: ${{ inputs.k3s_version }}
          INPUT_KUBERNETES_VERSION: ${{ inputs.kubernetes_version }}
          INPUT_LOCAL_STORAGE_TYPE: ${{ inputs.local_storage_type }}
          INPUT_SCENARIOS: ${{ inputs.scenarios }}
          INPUT_FAIL_FAST: ${{ inputs.fail_fast }}
        run: |
          # The inputs reach GITHUB_ENV, a download URL, a path and sed expressions: only
          # the shapes they are documented with are accepted (a newline or a sed delimiter
          # would run code with the environment's secrets).
          valid() { # valid <input> <value> <extended regexp>
            [[ -z "$2" || "$2" =~ $3 ]] || { echo "::error::the input $1 must match $3" >&2; exit 1; }
          }
          valid vendor "${E2E_VENDOR}" '^[a-z][a-z0-9]*$'
          grep -qxF -- "${E2E_VENDOR}" test/e2e-vendors.txt || { echo "::error::the vendor ${E2E_VENDOR} is not in test/e2e-vendors.txt" >&2; exit 1; }
          [[ -d "test/e2e-${E2E_VENDOR}" ]] || { echo "::error::test/e2e-${E2E_VENDOR}/ does not exist" >&2; exit 1; }
          valid mode "${INPUT_MODE}" '^(full|smoke)$'
          valid k3s_version "${INPUT_K3S_VERSION}" '^v1\.[0-9]+\.[0-9]+\+k3s[0-9]+$'
          valid kubernetes_version "${INPUT_KUBERNETES_VERSION}" '^v1\.[0-9]+\.[0-9]+$'
          valid local_storage_type "${INPUT_LOCAL_STORAGE_TYPE}" '^[a-z0-9]+\.[a-z0-9-]+\.[a-z0-9]+$'
          valid scenarios "${INPUT_SCENARIOS}" '^[a-z0-9,]+$'
          valid fail_fast "${INPUT_FAIL_FAST}" '^(true|false)$'
          # The scenarios: the input when given, else the mode's set (the smoke set is a pin of
          # the vendor's defaults.sh, read by sourcing it in a subshell).
          scenarios="${INPUT_SCENARIOS}"
          if [[ -z "${scenarios}" && "${INPUT_MODE}" == smoke ]]; then
            # shellcheck source=/dev/null
            scenarios="$(. "test/e2e-${E2E_VENDOR}/defaults.sh" && printf '%s' "${E2E_SMOKE_SCENARIOS}")"
            valid "the smoke scenarios of ${E2E_VENDOR}" "${scenarios}" '^[a-z0-9,]+$'
            [[ -n "${scenarios}" ]] || { echo "::error::test/e2e-${E2E_VENDOR}/defaults.sh sets no E2E_SMOKE_SCENARIOS" >&2; exit 1; }
          fi
          {
            echo "E2E_CREATED_AT=$(date +%s)"
            echo "E2E_OUT=${RUNNER_TEMP}/e2e"
            echo "KUBECONFIG=${RUNNER_TEMP}/e2e/admin.kubeconfig"
            echo "E2E_K3S_VERSION=${INPUT_K3S_VERSION}"
            echo "E2E_KUBERNETES_VERSION=${INPUT_KUBERNETES_VERSION}"
            echo "E2E_LOCAL_STORAGE_TYPE=${INPUT_LOCAL_STORAGE_TYPE}"
            echo "E2E_SCENARIOS=${scenarios:-all}"
            echo "E2E_FAIL_FAST=${INPUT_FAIL_FAST:-true}"
          } >> "${GITHUB_ENV}"
          # The vendor's own environment: the region of its lane.
          case "${E2E_VENDOR}" in
            aws) echo "AWS_REGION=${VAR_AWS_REGION:-us-east-2}" >> "${GITHUB_ENV}" ;;
            hcloud)
              valid E2E_HCLOUD_LOCATIONS "${VAR_HCLOUD_LOCATIONS}" '^[a-z0-9]+(,[a-z0-9]+)*$'
              echo "E2E_HCLOUD_LOCATIONS=${VAR_HCLOUD_LOCATIONS:-fsn1,nbg1,hel1}" >> "${GITHUB_ENV}"
              ;;
            ovh)
              valid OVH_REGION "${VAR_OVH_REGION}" '^[A-Za-z0-9-]+$'
              valid OVH_PROJECT_ID "${VAR_OVH_PROJECT_ID}" '^[0-9a-f]{32}$'
              valid OVH_AUTH_URL "${VAR_OVH_AUTH_URL}" '^https://[A-Za-z0-9./-]+$'
              {
                echo "OS_REGION_NAME=${VAR_OVH_REGION:-GRA11}"
                echo "OS_PROJECT_ID=${VAR_OVH_PROJECT_ID}"
                echo "OS_AUTH_URL=${VAR_OVH_AUTH_URL:-https://auth.cloud.ovh.net/v3}"
                echo "OS_USER_DOMAIN_NAME=Default"
              } >> "${GITHUB_ENV}"
              ;;
            vultr) echo "VULTR_REGION=${VAR_VULTR_REGION:-ewr}" >> "${GITHUB_ENV}" ;;
            alicloud) echo "ALICLOUD_REGION=${VAR_ALICLOUD_REGION:-ap-southeast-1}" >> "${GITHUB_ENV}" ;;
            upcloud) echo "UPCLOUD_ZONE=${VAR_UPCLOUD_ZONE:-fi-hel1}" >> "${GITHUB_ENV}" ;;
            azure)
              # IDs and names, validated like the inputs (a newline would reach GITHUB_ENV).
              guid='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
              valid AZURE_CLIENT_ID "${VAR_AZURE_CLIENT_ID}" "${guid}"
              valid AZURE_TENANT_ID "${VAR_AZURE_TENANT_ID}" "${guid}"
              valid AZURE_SUBSCRIPTION_ID "${VAR_AZURE_SUBSCRIPTION_ID}" "${guid}"
              valid AZURE_REGION "${VAR_AZURE_REGION}" '^[a-z0-9]+$'
              valid AZURE_RESOURCE_GROUP "${VAR_AZURE_RESOURCE_GROUP}" '^[A-Za-z0-9._()-]{1,90}$'
              {
                echo "AZURE_REGION=${VAR_AZURE_REGION:-westeurope}"
                echo "AZURE_CLIENT_ID=${VAR_AZURE_CLIENT_ID}"
                echo "AZURE_TENANT_ID=${VAR_AZURE_TENANT_ID}"
                echo "AZURE_SUBSCRIPTION_ID=${VAR_AZURE_SUBSCRIPTION_ID}"
                echo "AZURE_RESOURCE_GROUP=${VAR_AZURE_RESOURCE_GROUP}"
              } >> "${GITHUB_ENV}"
              ;;
            gcp)
              # The project has no default (none lives in this repository) and goes into
              # paths and filters: only the shape of a project id is accepted.
              [[ "${VAR_GCP_PROJECT}" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]] || { echo "::error::the variable GCP_PROJECT must be a project id" >&2; exit 1; }
              valid GCP_REGION "${VAR_GCP_REGION}" '^[a-z]+(-[a-z]+)*[0-9]+$'
              echo "GCP_PROJECT=${VAR_GCP_PROJECT}" >> "${GITHUB_ENV}"
              echo "GCP_REGION=${VAR_GCP_REGION:-us-central1}" >> "${GITHUB_ENV}"
              ;;
            oci)
              # OCIDs, a region and a URL go into paths, filters and the environment: only their shapes are
              # accepted (a newline would add a variable to GITHUB_ENV). None has a default but the region.
              valid OCI_COMPARTMENT "${VAR_OCI_COMPARTMENT}" '^ocid1\.compartment\.oc[0-9]+\.[a-z0-9-]*\.[A-Za-z0-9]+$'
              valid OCI_TENANCY "${VAR_OCI_TENANCY}" '^ocid1\.tenancy\.oc[0-9]+\.[a-z0-9-]*\.[A-Za-z0-9]+$'
              [[ -n "${VAR_OCI_COMPARTMENT}" && -n "${VAR_OCI_TENANCY}" && -n "${VAR_OCI_CLIENT_ID}" ]] || { echo "::error::the variables OCI_COMPARTMENT, OCI_TENANCY and OCI_CLIENT_ID must be set" >&2; exit 1; }
              valid OCI_REGION "${VAR_OCI_REGION}" '^[a-z]{2}(-[a-z]+)+-[0-9]+$'
              valid OCI_HOME_REGION "${VAR_OCI_HOME_REGION}" '^[a-z]{2}(-[a-z]+)+-[0-9]+$'
              valid OCI_IDENTITY_DOMAIN_URL "${VAR_OCI_IDENTITY_DOMAIN_URL}" '^https://idcs-[a-f0-9]+\.identity\.[a-z.]*oraclecloud\.com$'
              [[ -n "${VAR_OCI_IDENTITY_DOMAIN_URL}" ]] || { echo "::error::the variable OCI_IDENTITY_DOMAIN_URL must be set" >&2; exit 1; }
              valid OCI_CLIENT_ID "${VAR_OCI_CLIENT_ID}" '^[A-Za-z0-9_-]+$'
              valid OCI_OIDC_AUDIENCE "${VAR_OCI_OIDC_AUDIENCE}" '^[A-Za-z0-9:/._-]+$'
              {
                echo "OCI_COMPARTMENT=${VAR_OCI_COMPARTMENT}"
                echo "OCI_TENANCY=${VAR_OCI_TENANCY}"
                echo "OCI_REGION=${VAR_OCI_REGION:-eu-frankfurt-1}"
                echo "OCI_HOME_REGION=${VAR_OCI_HOME_REGION:-${VAR_OCI_REGION:-eu-frankfurt-1}}"
                echo "OCI_IDENTITY_DOMAIN_URL=${VAR_OCI_IDENTITY_DOMAIN_URL}"
                echo "OCI_CLIENT_ID=${VAR_OCI_CLIENT_ID}"
                echo "OCI_OIDC_AUDIENCE=${VAR_OCI_OIDC_AUDIENCE:-oci-federation}"
              } >> "${GITHUB_ENV}"
              ;;
          esac
          mkdir -p "${RUNNER_TEMP}/e2e"
          # Everything validated: from here the steps that always run may use the vendor in a path.
          echo "E2E_PREPARED=true" >> "${GITHUB_ENV}"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false # a privileged job restores no cache

      # Step 1: the runner joins the tailnet with the federated identity (the scope auth_keys
      # for tag:scarpenter-ci; no stored secret). The sha256 is that of the amd64 tarball of the release.
      - name: Join the tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:scarpenter-ci
          version: 1.98.10
          sha256sum: 52490ce0832b245857e2afef7426d6ae5a4b49fb391412833cc95729bd23f7de
          hostname: scarpenter-ci-${{ github.run_id }}-${{ inputs.vendor }}
          use-cache: false

      # Hetzner has no federation: the token of the dedicated CI project is a secret of the
      # environment e2e (required reviewers approve every run). It is needed from the first
      # step on (bootstrap.sh makes the Flatcar snapshots), so this step comes before it.
      - name: The CI project's token (hcloud)
        if: inputs.vendor == 'hcloud'
        env:
          HCLOUD_TOKEN_SECRET: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          [ -n "${HCLOUD_TOKEN_SECRET}" ] || { echo "::error::the environment secret HCLOUD_TOKEN is not set"; exit 1; }
          echo "::add-mask::${HCLOUD_TOKEN_SECRET}"
          echo "HCLOUD_TOKEN=${HCLOUD_TOKEN_SECRET}" >> "${GITHUB_ENV}"

      - name: k3s, flannel and kube-proxy
        run: |
          "test/e2e-${E2E_VENDOR}/bootstrap.sh"

      # Step 2: an ephemeral, pre-authorized, reusable key for the nodes.
      - name: Mint the nodes' auth key
        run: |
          "test/e2e-${E2E_VENDOR}/mint-authkey.sh"

      # Step 3: the CI role through GitHub's OIDC; its temporary credentials go into a
      # Secret for SCarpenter (the cluster issuer is not public, web identity from it is
      # not testable on an ephemeral runner). One such step per vendor: add the next one
      # here (docs/how-to-guides/testing-and-releasing.md#adding-a-vendor-lane).
      - name: Assume the CI role (aws)
        if: inputs.vendor == 'aws'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
          role-session-name: scarpenter-ci-${{ github.run_id }}
          # The controller keeps these credentials for the whole run: two hours (the role's
          # maximum session duration must allow it, docs/how-to-guides/testing.md).
          role-duration-seconds: 7200

      # The OVH lane's identity: a dedicated OpenStack user of the lane's own project (the
      # five operator roles, docs/how-to-guides/ovh-credentials.md), from environment secrets;
      # the openstack CLI and the controller read the standard OS_* variables. A newline in a
      # secret would add a variable to GITHUB_ENV: refused.
      - name: OpenStack credentials and CLI (ovh)
        if: inputs.vendor == 'ovh'
        env:
          OVH_OS_USERNAME: ${{ secrets.OVH_OS_USERNAME }}
          OVH_OS_PASSWORD: ${{ secrets.OVH_OS_PASSWORD }}
        run: |
          [[ -n "${OVH_OS_USERNAME}" && -n "${OVH_OS_PASSWORD}" ]] || { echo "::error::the secrets OVH_OS_USERNAME and OVH_OS_PASSWORD are not set in the environment e2e" >&2; exit 1; }
          [[ "${OVH_OS_USERNAME}${OVH_OS_PASSWORD}" != *$'\n'* ]] || { echo "::error::a credential contains a newline" >&2; exit 1; }
          echo "::add-mask::${OVH_OS_PASSWORD}"
          {
            echo "OS_USERNAME=${OVH_OS_USERNAME}"
            echo "OS_PASSWORD=${OVH_OS_PASSWORD}"
          } >> "${GITHUB_ENV}"
          # The CLI of the lane's scripts: the client and every dependency pinned, by the
          # OpenStack upper constraints of the release the client belongs to (8.2.0 is 2025.2).
          pipx install "python-openstackclient==8.2.0" \
            --pip-args="--constraint https://raw.githubusercontent.com/openstack/requirements/stable/2025.2/upper-constraints.txt"

      # Vultr has no OIDC for callers: the key of the CI account's dedicated sub-user is a
      # secret of the environment e2e (plan 20, section 9; its IP allowlist must admit
      # GitHub-hosted runners, so required reviewers and the fork rule are the wall). The
      # account's own limits are the cost ceiling: a key cannot deny plans or regions.
      - name: Vultr API key (vultr)
        if: inputs.vendor == 'vultr'
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
        run: |
          [ -n "${VULTR_API_KEY}" ] || { echo "::error::the environment secret VULTR_API_KEY is not set" >&2; exit 1; }
          echo "VULTR_API_KEY=${VULTR_API_KEY}" >> "${GITHUB_ENV}"
      # The same for Alibaba Cloud, without a third-party action: the job's OIDC token goes to a
      # file and the role is named in the environment (test/e2e-alicloud/oidc-token.sh); the
      # scripts exchange the token for a role session of two hours themselves (ali_login of lib.sh)
      # and put it in a Secret for SCarpenter.
      - name: Write the OIDC token for the CI role (alicloud)
        if: inputs.vendor == 'alicloud'
        env:
          ALICLOUD_ROLE_ARN: ${{ secrets.ALICLOUD_ROLE_ARN }}
          ALICLOUD_OIDC_PROVIDER_ARN: ${{ secrets.ALICLOUD_OIDC_PROVIDER_ARN }}
          ALICLOUD_OIDC_AUDIENCE: ${{ vars.ALICLOUD_OIDC_AUDIENCE || 'sts.aliyuncs.com' }}
          ALICLOUD_SESSION_NAME: scarpenter-ci-${{ github.run_id }}
        run: test/e2e-alicloud/oidc-token.sh
      # UpCloud has no OIDC federation and no workload identity: the credential is the API
      # token of a dedicated sub-account (scarpenter-ci), the environment secret UPCLOUD_TOKEN.
      # Its resource limits (set by the main account) are the cost guard, and the token expires
      # (up to a year; the canary notices). It goes into GITHUB_ENV (masked) for the scripts
      # below, which put it into the controller's Secret.
      - name: Export the API token (upcloud)
        if: inputs.vendor == 'upcloud'
        env:
          UPCLOUD_TOKEN_IN: ${{ secrets.UPCLOUD_TOKEN }}
        run: |
          [[ -n "${UPCLOUD_TOKEN_IN}" ]] || { echo "::error::the environment secret UPCLOUD_TOKEN is not set" >&2; exit 1; }
          echo "::add-mask::${UPCLOUD_TOKEN_IN}"
          echo "UPCLOUD_TOKEN=${UPCLOUD_TOKEN_IN}" >> "${GITHUB_ENV}"
      # Azure: the CI identity through GitHub's OIDC (a federated credential on a
      # user-assigned managed identity: no secret). The runner's az session is for the scenarios
      # and the teardown; the controller in k3s reads a federated token file (next step).
      - name: Log in to Azure (azure)
        if: inputs.vendor == 'azure'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The controller's federated token: written to the file it reads (AZURE_FEDERATED_TOKEN_FILE
      # is set by the chart values of the lane, from the Secret install.sh makes of this file) and
      # renewed in the background: GitHub's OIDC token is short-lived and a run outlives it, and
      # WorkloadIdentityCredential re-reads the file. The loop also logs the runner's az session
      # in again now and then (its access token lasts about an hour) and stops with the teardown.
      - name: Federated token for the controller (azure)
        if: inputs.vendor == 'azure'
        env:
          AZURE_TOKEN_SECRET: scarpenter-system/azure-federated-token
          AZURE_RELOGIN: "true"
        run: |
          test/e2e-azure/azure-token.sh start "${E2E_OUT}/azure-token"

      # GCP: the job's OIDC token is exchanged through workload identity
      # federation for the CI service account's access (no key file). The credentials file
      # the action writes is what install.sh puts into the Secret for SCarpenter (the
      # cluster issuer is not public, so web identity from it is not testable on a runner).
      - name: Authenticate to Google Cloud (gcp)
        if: inputs.vendor == 'gcp'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT }}
          create_credentials_file: true
          export_environment_variables: true

      # Oracle Cloud: the keyless token exchange (test/e2e-oci/oci-session.sh): the job's OIDC token is
      # exchanged at the identity domain for a session token for the oci CLI of the scripts; the token file
      # itself, renewed in the background, is what the Go programs and the controller in k3s exchange (the
      # cluster issuer is not public, so the chart's own ServiceAccount token could not be trusted). The one
      # stored secret is the confidential application's client secret. The CLI is pinned by version.
      - name: Install the oci CLI (oci)
        if: inputs.vendor == 'oci'
        run: pipx install "oci-cli==3.94.2"

      - name: Start the OCI session (oci)
        if: inputs.vendor == 'oci'
        env:
          OCI_CLIENT_SECRET: ${{ secrets.OCI_CLIENT_SECRET }}
          OCI_TOKEN_SECRET: scarpenter-system/oci-federated-token
        run: |
          [[ -n "${OCI_CLIENT_SECRET}" ]] || { echo "::error::the environment secret OCI_CLIENT_SECRET is not set" >&2; exit 1; }
          test/e2e-oci/oci-session.sh start "${RUNNER_TEMP}/oci-session"

      # Keeper's snapshot routes need an API key: read from the parameter the repository
      # variable KEEPER_API_KEY_PARAMETER names, with the environment's CI role, for this step
      # only (no credentials are left in the job). Without the role or the variable (a fork) the
      # step is skipped and the controller reads Keeper without a key.
      - name: Keeper API key
        id: keeper
        uses: ./.github/actions/keeper-key
        with:
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          parameter-arn: ${{ vars.KEEPER_API_KEY_PARAMETER }}
          optional: "true"

      # Step 4: image and chart.
      - name: Build the image, install the chart
        env:
          # install.sh makes the Secret keeper-api-key of this file (empty: none).
          KEEPER_API_KEY_FILE: ${{ steps.keeper.outputs.file }}
        run: |
          "test/e2e-${E2E_VENDOR}/install.sh"

      # Step 5: the scenarios.
      # Its own limit, so that a hung scenario cannot take the time of the diagnostics and
      # the teardown (90 - 55 minutes, less the setup, stay for them; smoke: 60 - 25).
      - name: Scenarios
        timeout-minutes: ${{ inputs.mode == 'smoke' && 25 || 55 }}
        run: |
          "test/e2e-${E2E_VENDOR}/scenarios.sh"

      - name: Diagnostics
        if: failure() && env.E2E_PREPARED == 'true'
        timeout-minutes: 10 # never at the cost of the teardown
        run: |
          "test/e2e-${E2E_VENDOR}/diagnostics.sh"

      # The artifacts of a public repository are public: the files are redacted
      # (test/e2e-<vendor>/diagnostics.sh) and kept for three days.
      - name: Upload the diagnostics and the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ inputs.vendor }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/e2e/diag/
            ${{ runner.temp }}/e2e/logs/
            ${{ runner.temp }}/e2e/report.txt
            ${{ runner.temp }}/e2e/notes.txt
          retention-days: 3
          if-no-files-found: ignore

      - name: Report
        if: always() && env.E2E_PREPARED == 'true'
        run: |
          {
            echo "### L5 ${E2E_VENDOR}: ${E2E_MODE} (${E2E_SCENARIOS})"
            [ -f "${E2E_OUT}/report.txt" ] && { echo '```'; cat "${E2E_OUT}/report.txt"; echo '```'; }
            [ -f "${E2E_OUT}/notes.txt" ] && { echo '### Notes'; echo '```'; cat "${E2E_OUT}/notes.txt"; echo '```'; }
            true
          } >> "${GITHUB_STEP_SUMMARY}"

      # Teardown: the first credentials may be an hour old (or the job was cancelled at the
      # timeout), so the role is assumed again.
      - name: Assume the CI role again for the teardown (aws)
        if: always() && env.E2E_PREPARED == 'true' && inputs.vendor == 'aws'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
          role-session-name: scarpenter-ci-${{ github.run_id }}-teardown
          unset-current-credentials: true

      - name: Write a fresh OIDC token for the teardown (alicloud)
        if: always() && env.E2E_PREPARED == 'true' && inputs.vendor == 'alicloud'
        env:
          ALICLOUD_ROLE_ARN: ${{ secrets.ALICLOUD_ROLE_ARN }}
          ALICLOUD_OIDC_PROVIDER_ARN: ${{ secrets.ALICLOUD_OIDC_PROVIDER_ARN }}
          ALICLOUD_OIDC_AUDIENCE: ${{ vars.ALICLOUD_OIDC_AUDIENCE || 'sts.aliyuncs.com' }}
          ALICLOUD_SESSION_NAME: scarpenter-ci-${{ github.run_id }}-teardown
        run: test/e2e-alicloud/oidc-token.sh
      - name: Log in to Azure again for the teardown (azure)
        if: always() && env.E2E_PREPARED == 'true' && inputs.vendor == 'azure'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Authenticate to Google Cloud again for the teardown (gcp)
        if: always() && env.E2E_PREPARED == 'true' && inputs.vendor == 'gcp'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT }}
          create_credentials_file: true
          export_environment_variables: true

      # The first session may be hours old (or the job was cancelled at the timeout): exchange again.
      - name: Exchange again for the teardown (oci)
        if: always() && env.E2E_PREPARED == 'true' && inputs.vendor == 'oci'
        env:
          OCI_CLIENT_SECRET: ${{ secrets.OCI_CLIENT_SECRET }}
        run: test/e2e-oci/oci-session.sh once "${OCI_SESSION_DIR:-${RUNNER_TEMP}/oci-session}"

      - name: Teardown
        if: always() && env.E2E_PREPARED == 'true'
        run: |
          "test/e2e-${E2E_VENDOR}/teardown.sh"
