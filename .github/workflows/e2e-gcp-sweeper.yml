name: L5 sweeper (GCP e2e)

# Deletes what the L5 lane (e2e-cloud.yml, vendor gcp) left behind in its project when a run died or
# was cancelled before its teardown: instances, resource policies, firewall rules, subnetworks
# and the managed VPC network of every cluster named scarpenter-ci-* that is older than two
# hours, in the lane's region (GCP_REGION). Instances are found by their label
# scarpenter-cluster, the label-less resources by the name prefix scarpenter-<cluster>- together
# with the ownership marker in their description (and the lane's brought resources by
# scarpenter-e2e-byo-* and their own marker); the age is the creation timestamp. The selection logic
# is pkg/vendors/gcp/sweep (tested against the GCP driver's in-memory Compute API);
# docs/how-to-guides/testing.md#the-l5-lane describes it. Disks go with their instance
# (autoDelete); the lane's teardown checks for leftovers. Same identity as the lane, but its own
# environment, e2e-sweeper: limited to main and without reviewers, so that a scheduled sweep never
# waits for an approval, and a manual run from another branch (whose code would hold the identity
# without a review) is refused. The workload identity provider trusts the OIDC subject of both
# environments.
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be deleted"
        default: false
        type: boolean
      max_age:
        description: "Minimum age of what is deleted (a Go duration)"
        default: 2h
        type: string
      regions:
        description: "Regions to sweep: a comma list, or all (default: the lane's region)"
        default: ""
        type: string

# One sweep at a time, and not while a lane run is tearing down (the age limit keeps it
# away from a running one anyway).
concurrency:
  group: e2e-gcp-sweeper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    if: github.repository == 'SpareCores/scarpenter'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: e2e-sweeper
    permissions:
      contents: read
      id-token: write # the OIDC token the workload identity federation takes
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false # a privileged job restores no cache

      - name: Check the project
        run: |
          [[ "${GCP_PROJECT}" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]] || { echo "::error::the variable GCP_PROJECT must be a project id"; exit 1; }
          [[ "${GCP_REGION}" =~ ^[a-z]+(-[a-z]+)*[0-9]+$ ]] || { echo "::error::the variable GCP_REGION must look like us-central1"; exit 1; }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Sweep
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_MAX_AGE: ${{ inputs.max_age }}
          INPUT_REGIONS: ${{ inputs.regions }}
        run: |
          # Not below two hours: a lane run may take 90 minutes, and its resources must never
          # look old enough to sweep while it runs.
          age="${INPUT_MAX_AGE:-2h}"
          if ! [[ "${age}" =~ ^(([2-9]|[1-9][0-9]+)h|(1[2-9][0-9]|[2-9][0-9]{2}|[1-9][0-9]{3,})m)$ ]]; then
            echo "::error::max_age must be at least 2h (a Go duration in whole hours or minutes)"; exit 1
          fi
          regions="${INPUT_REGIONS:-${GCP_REGION}}"
          if ! [[ "${regions}" =~ ^(all|[a-z0-9,-]+)$ ]]; then
            echo "::error::regions must be a comma list of regions, or all"; exit 1
          fi
          args=(-project "${GCP_PROJECT}" -max-age "${age}" -regions "${regions}")
          if [ "${INPUT_DRY_RUN}" = "true" ]; then args+=(-dry-run); fi
          go run ./test/e2e-gcp/sweeper "${args[@]}"
