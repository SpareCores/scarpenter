name: L5 (e2e)

# The one workflow that starts real cloud instances, and only by hand (Actions, Run workflow;
# docs/how-to-guides/testing-and-releasing.md): no pull request, push, tag or timer runs it.
# The vendors are lines of test/e2e-vendors.txt, the lane itself is e2e-cloud.yml (called once
# per vendor), the plan is test/e2e-plan.sh. The nightly canary (e2e-canary.yml) is free.
#
# What to test: the branch, tag or commit the run is dispatched on, or, instead, the head of the
# pull request "pr" or the commit "sha" (a full SHA on a branch of this repository). The commit
# is resolved once in the plan job and every vendor's job checks out that exact SHA.
#
# A pull request from a fork runs only when "allow_fork" is true: its code (the scripts of the
# lane, the Go code that is built and installed) then runs with the cloud role and the tailnet
# identity, so read its diff first. The environment "e2e" has required reviewers (configured
# outside this repository) who approve every vendor's job, and the plan job's summary
# names the commit they approve.
on:
  workflow_dispatch:
    inputs:
      vendors:
        description: "all, or comma separated vendors (lines of test/e2e-vendors.txt): aws or aws,oci"
        default: all
        type: string
      mode:
        description: "smoke (preflight, one node, scale to zero), full (every scenario), or comma separated scenarios, e.g. gpu or amd64,drift; manual-only scenarios (azure: cvm) run only when listed (aws: amd64 arm64 db described byo local negative quota drift scalezero uninstall; ovh: amd64 db described byo negative quota drift poweroff scalezero uninstall)"
        default: smoke
        type: string
      gpu_instance_type:
        description: "Instance type of the gpu scenario, with the vendor prefix (E2E_GPU_TYPE); empty: the vendor's default. Use with one vendor"
        default: ""
        type: string
      cvm_instance_type:
        description: "Instance type of the cvm scenario, with the vendor prefix (E2E_TYPE_CVM); empty: the vendor's default. Use with one vendor"
        default: ""
        type: string
      env:
        description: "More overrides of the lane's defaults: comma separated E2E_KEY=VALUE (letters, digits and ._:/+- in values)"
        default: ""
        type: string
      pr:
        description: "Pull request number: test its head commit instead of the dispatch ref"
        default: ""
        type: string
      sha:
        description: "Full commit SHA on a branch of this repository: test it instead of the dispatch ref"
        default: ""
        type: string
      allow_fork:
        description: "Allow a pull request from a fork: its code runs with the cloud credentials, after you read it"
        default: false
        type: boolean
      fail_fast:
        description: "Skip the remaining scenarios after the first failure, so that the diagnostics and the teardown start at once"
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  # No secret, no environment: it resolves the commit and plans the matrix.
  plan:
    if: github.repository == 'SpareCores/scarpenter'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the head of the pull request
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
      env_overrides: ${{ steps.plan.outputs.env_overrides }}
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # to tell whether a commit is on a branch of this repository

      - name: Commit to test
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
          ALLOW_FORK: ${{ inputs.allow_fork }}
        run: |
          [[ -z "${PR}" || -z "${SHA}" ]] || { echo "::error::give pr or sha, not both" >&2; exit 1; }
          if [[ -n "${PR}" ]]; then
            [[ "${PR}" =~ ^[0-9]+$ ]] || { echo "::error::pr must be a number" >&2; exit 1; }
            gh api "repos/${GH_REPO}/pulls/${PR}" >pr.json
            sha="$(jq -r .head.sha pr.json)"
            if [[ "$(jq -r .head.repo.full_name pr.json)" != "${GH_REPO}" ]]; then
              [[ "${ALLOW_FORK}" == true ]] || { echo "::error::pull request ${PR} is from a fork: its code would run with the cloud credentials; read it, then dispatch with allow_fork=true" >&2; exit 1; }
              echo "::warning::pull request ${PR} is from a fork: ${sha} runs with the cloud credentials once the environment approves"
            fi
            what="the head of pull request ${PR}"
          elif [[ -n "${SHA}" ]]; then
            [[ "${SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40 character commit SHA" >&2; exit 1; }
            git cat-file -e "${SHA}^{commit}" 2>/dev/null && [[ -n "$(git branch -r --contains "${SHA}")" ]] ||
              { echo "::error::${SHA} is not on a branch of this repository: for a fork, dispatch with its pull request number" >&2; exit 1; }
            sha="${SHA}"
            what="the commit given"
          else
            sha="${GITHUB_SHA}"
            what="the dispatch ref ${GITHUB_REF_NAME}"
          fi
          echo "sha=${sha}" | tee -a "${GITHUB_OUTPUT}"
          echo "Testing ${what}: ${sha}" | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Plan
        id: plan
        env:
          VENDORS: ${{ inputs.vendors }}
          MODE: ${{ inputs.mode }}
          GPU: ${{ inputs.gpu_instance_type }}
          CVM: ${{ inputs.cvm_instance_type }}
          ENV_LIST: ${{ inputs.env }}
        run: |
          test/e2e-plan.sh dispatch "${VENDORS}" "${MODE}" "${GPU}" "${CVM}" "${ENV_LIST}" | tee plan.txt
          cat plan.txt >>"${GITHUB_OUTPUT}"
          { echo; echo "Plan: \`$(sed -n 's/^matrix=//p' plan.txt)\`"; echo "Overrides: \`$(sed -n 's/^env_overrides=//p' plan.txt)\`"; } >>"${GITHUB_STEP_SUMMARY}"

  e2e:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false # one vendor's failure says nothing about the others
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/e2e-cloud.yml
    secrets: inherit # the environment secrets of the called job's environment (e2e) reach it only so far as that job names it
    with:
      vendor: ${{ matrix.vendor }}
      mode: ${{ matrix.mode }}
      scenarios: ${{ matrix.scenarios }}
      fail_fast: ${{ inputs.fail_fast }}
      ref: ${{ needs.plan.outputs.sha }}
      env_overrides: ${{ needs.plan.outputs.env_overrides }}
    permissions:
      contents: read
      id-token: write
