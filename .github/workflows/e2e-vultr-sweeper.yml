name: L5 sweeper (Vultr e2e)

# Deletes what the L5 lane (e2e-cloud.yml, vendor vultr) left behind in the account when a run
# died or was cancelled before its teardown: instances, firewall groups and VPCs of every cluster
# named scarpenter-ci-* that is older than two hours (the groups and VPCs by the ownership marker
# in their description, which they have instead of tags). It never touches a snapshot: the
# Flatcar snapshot of the account is permanent and cannot be shared again. The selection logic
# is pkg/vendors/vultr/sweep (tested against the Vultr driver's in-memory API);
# docs/how-to-guides/testing.md#the-l5-lane describes what it reads. The key is that of the
# lane's sub-user, but the sweeper has its own environment, e2e-sweeper: limited to main and
# without reviewers, so that a scheduled sweep never waits for an approval, and a manual run from
# another branch (whose code would hold the key without a review) is refused. The environment
# needs the secret VULTR_API_KEY and the variable VULTR_REGION (optional, default ewr).
on:
  schedule:
    - cron: "29 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be deleted"
        default: false
        type: boolean
      max_age:
        description: "Minimum age of what is deleted (a Go duration)"
        default: 2h
        type: string
      regions:
        description: "Regions of instances and VPCs to sweep: a comma list, or all (default: the lane's region)"
        default: ""
        type: string

# One sweep at a time, and not while a lane run is tearing down (the age limit keeps it
# away from a running one anyway).
concurrency:
  group: e2e-vultr-sweeper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    if: github.repository == 'SpareCores/scarpenter'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: e2e-sweeper
    permissions:
      contents: read
    env:
      VULTR_REGION: ${{ vars.VULTR_REGION || 'ewr' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false # a privileged job restores no cache

      - name: Sweep
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_MAX_AGE: ${{ inputs.max_age }}
          INPUT_REGIONS: ${{ inputs.regions }}
        run: |
          [ -n "${VULTR_API_KEY}" ] || { echo "::error::the environment secret VULTR_API_KEY is not set" >&2; exit 1; }
          # Not below two hours: a lane run may take 90 minutes, and its objects must never
          # look old enough to sweep while it runs.
          age="${INPUT_MAX_AGE:-2h}"
          if ! [[ "${age}" =~ ^(([2-9]|[1-9][0-9]+)h|(1[2-9][0-9]|[2-9][0-9]{2}|[1-9][0-9]{3,})m)$ ]]; then
            echo "::error::max_age must be at least 2h (a Go duration in whole hours or minutes)"; exit 1
          fi
          args=(-max-age "${age}" -regions "${INPUT_REGIONS:-${VULTR_REGION}}")
          if [ "${INPUT_DRY_RUN}" = "true" ]; then args+=(-dry-run); fi
          go run ./test/e2e-vultr/sweeper "${args[@]}"
