# The qemu driver's catalog (overview section 13.3): one region and one zone on
# the machine SCarpenter runs on. The prices are made up and only give the
# scheduler an order. qemu.local has two local disks of 4 GB (the driver attaches
# them as extra disk images), for the local storage policies.
vendors:
  - name: qemu
    regions:
      - {name: local, zones: [local-a]}
    types:
      - name: small
        family: qemu
        arch: amd64
        vcpus: 2
        memoryMiB: 2048
        prices:
          - {region: local, onDemand: 0.010}
      - name: medium
        family: qemu
        arch: amd64
        vcpus: 2
        memoryMiB: 4096
        prices:
          - {region: local, onDemand: 0.020}
      - name: local
        family: qemu
        arch: amd64
        vcpus: 2
        memoryMiB: 4096
        localStorageGB: 8
        localStorageCount: 2
        prices:
          - {region: local, onDemand: 0.025}
      # The one spot type (the L4 scenario of the interruption node agent): dearer than
      # small in both capacity types, so that no other scenario schedules onto it.
      - name: spot
        family: qemu
        arch: amd64
        vcpus: 2
        memoryMiB: 2048
        prices:
          - {region: local, onDemand: 0.012, spot: 0.011}
      # The GPU types only describe a GPU: the VMs have none. The L4 lane boots them to
      # prove the node bootstrap of NVIDIA types without hardware (plan 12 step (d)):
      # gpu is a T4 (the driver check fails), gpu-nvswitch an 8-GPU A100 HGX system
      # (Fabric Manager runs, and the check fails). The catalog offers them
      # with the driver labels (nvidia.NodeBootstrap).
      - name: gpu
        family: qemu
        arch: amd64
        vcpus: 2
        memoryMiB: 4096
        gpus: 1
        gpuModel: T4
        gpuManufacturer: NVIDIA
        prices:
          - {region: local, onDemand: 0.030}
      - name: gpu-nvswitch
        family: qemu
        arch: amd64
        vcpus: 2
        memoryMiB: 4096
        gpus: 8
        gpuModel: A100
        gpuManufacturer: NVIDIA
        prices:
          - {region: local, onDemand: 0.040}
