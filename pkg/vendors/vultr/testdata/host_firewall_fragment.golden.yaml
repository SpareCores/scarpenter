variant: flatcar
version: 1.1.0
storage:
  files:
    - path: /etc/scarpenter/host-firewall.nft
      mode: 0644
      contents:
        inline: |
          add table inet scarpenter_host
          delete table inet scarpenter_host
          table inet scarpenter_host {
            chain input {
              type filter hook input priority filter; policy drop;
              iifname "lo" accept
              iifname != "@PUBLIC_IF@" accept
              ct state established,related accept
              ct state invalid drop
              icmpv6 type { nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
              ip saddr 203.0.113.7/32 tcp dport 22 accept
              ip saddr 10.0.0.0/8 tcp dport 8000-9000 accept
              meta nfproto ipv4 udp dport 1-65535 accept
              ip saddr 198.51.100.0/24 meta l4proto icmp accept
              ip6 saddr 2001:db8::/32 tcp dport 443 accept
              meta nfproto ipv6 meta l4proto ipv6-icmp accept
              ip saddr 192.0.2.0/24 meta l4proto tcp accept
              ip saddr 192.0.2.1/32 meta l4proto gre accept
            }
          }
    - path: /opt/scarpenter/bin/scarpenter-host-firewall
      mode: 0755
      contents:
        inline: |
          #!/bin/sh
          set -eu
          dev=$(ip -4 route show default | awk '{ for (i = 1; i < NF; i++) if ($i == "dev") { print $(i + 1); exit } }')
          if [ -z "$dev" ]; then
            echo "no default route: the public interface is unknown" >&2
            exit 1
          fi
          sed "s/@PUBLIC_IF@/$dev/" /etc/scarpenter/host-firewall.nft | nft -f -
systemd:
  units:
    - name: scarpenter-host-firewall.service
      enabled: true
      contents: |
        [Unit]
        Description=Filter the public interface like the Vultr firewall group
        After=network-online.target
        Wants=network-online.target
        Before=kubelet.service
        [Service]
        Type=oneshot
        RemainAfterExit=yes
        ExecStart=/opt/scarpenter/bin/scarpenter-host-firewall
        [Install]
        WantedBy=multi-user.target
    - name: kubelet.service
      dropins:
        - name: 16-scarpenter-host-firewall.conf
          contents: |
            [Unit]
            Requires=scarpenter-host-firewall.service
            After=scarpenter-host-firewall.service
