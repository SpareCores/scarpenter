version: "2"
run:
  allow-parallel-runners: true
  # The development vendors (scarpenter_dev), the lanes (L3 kwok, L4 qemu) and
  # the chart tests.
  build-tags:
    - scarpenter_dev
    - kwok
    - qemu
    - chart
linters:
  default: none
  enable:
    - copyloopvar
    - depguard
    - dupl
    - errcheck
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - modernize
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    depguard:
      rules:
        forbid-sort-pkg:
          deny:
            - pkg: sort
              desc: Should be replaced with slices package
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    modernize:
      disable:
        - omitzero
  exclusions:
    generated: lax
    rules:
      # Table-driven tests repeat expected messages on purpose.
      - linters:
          - goconst
        path: _test\.go
      # Table-driven tests keep one case per line.
      - linters:
          - lll
        path: _test\.go
      # Flag registration: one flag per line, with its environment fallback.
      - linters:
          - lll
        path: pkg/(operator/options|vendors/(fake|qemu))/options\.go
      # Test helpers take the parameters scenarios vary, even where today's
      # scenarios pass one value.
      - linters:
          - unparam
        path: _test\.go
      # The AWS driver's API interfaces and everything that implements them repeat
      # the SDK's long method signatures (the real client, the timeouts, the fake).
      - linters:
          - lll
        path: pkg/vendors/aws/(api|timeouts)\.go
      - linters:
          - lll
          - goconst
          - dupl
        path: pkg/vendors/aws/fake/
      # The error table of the AWS driver and the test's independent copy of it.
      - linters:
          - dupl
        path: pkg/vendors/aws/errors(_test)?\.go
      # API types carry long kubebuilder markers and CEL rules.
      - linters:
          - lll
        path: pkg/apis/*
      # Vendor blocks repeat the shape of their sibling vendors on purpose.
      - linters:
          - dupl
        path: pkg/apis/*
      - linters:
          - dupl
          - lll
        path: internal/*
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
