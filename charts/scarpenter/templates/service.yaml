{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "scarpenter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scarpenter.labels" . | nindent 4 }}
  {{- with .Values.metrics.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.metrics.service.type }}
  selector:
    {{- include "scarpenter.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.karpenter.metricsPort }}
      targetPort: metrics
      protocol: TCP
{{- end }}
