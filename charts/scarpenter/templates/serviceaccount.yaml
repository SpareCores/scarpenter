{{- if .Values.serviceAccount.create }}
{{- $aws := .Values.vendors.aws }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "scarpenter.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scarpenter.labels" . | nindent 4 }}
  {{- $annotations := .Values.serviceAccount.annotations }}
  {{- if and $aws.enabled (eq $aws.credentials.mode "webIdentity") $aws.credentials.webIdentity.annotateServiceAccount $aws.credentials.webIdentity.roleArn }}
  {{- $annotations = merge (dict "eks.amazonaws.com/role-arn" $aws.credentials.webIdentity.roleArn) $annotations }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
