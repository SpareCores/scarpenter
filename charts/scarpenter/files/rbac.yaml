# Generated from config/rbac and config/rbac-core by hack/chart-sync.sh (make chart-rbac); do not edit.
controller:
  rules:
    # The API, with server-side apply on the status (two controllers write it,
    # under their own field managers).
    - apiGroups: ["scarpenter.sparecores.com"]
      resources: ["scnodeclasses"]
      verbs: ["get", "list", "watch", "update", "patch"]
    - apiGroups: ["scarpenter.sparecores.com"]
      resources: ["scnodeclasses/status"]
      verbs: ["get", "update", "patch"]
    # The serving certificate approver reads NodeClaims and Nodes and approves
    # kubelet-serving requests, nothing else (the signer is named). The billing
    # retention controller (ADR-024) also patches Nodes (the do-not-disrupt,
    # retain-until and billing-start annotations, the releasing taint), deletes
    # the NodeClaim of an empty node at the end of its paid period, reads the pods
    # of a node and the NodePools (disruption budgets, limits).
    - apiGroups: ["karpenter.sh"]
      resources: ["nodeclaims"]
      verbs: ["get", "list", "watch", "delete"]
    - apiGroups: ["karpenter.sh"]
      resources: ["nodepools"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["nodes"]
      verbs: ["get", "list", "watch", "patch"]
    - apiGroups: [""]
      resources: ["pods"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["certificates.k8s.io"]
      resources: ["certificatesigningrequests"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["certificates.k8s.io"]
      resources: ["certificatesigningrequests/approval"]
      verbs: ["update"]
    - apiGroups: ["certificates.k8s.io"]
      resources: ["signers"]
      resourceNames: ["kubernetes.io/kubelet-serving"]
      verbs: ["approve"]
    # The ConfigMaps an SCNodeClass points at (network.custom and butane) and the
    # cluster CA ConfigMap. References name a namespace, so this is cluster-wide
    # read access to ConfigMaps. Secrets are not here: see the Role below.
    - apiGroups: [""]
      resources: ["configmaps"]
      verbs: ["get"]
bootstrapTokens:
  rules:
    - apiGroups: [""]
      resources: ["secrets"]
      # get and list cannot be limited to the token Secrets (RBAC has no label
      # selector): the controller can read every Secret of kube-system.
      verbs: ["get", "list", "create", "delete"]
authKey:
  rules:
    - apiGroups: [""]
      resources: ["secrets"]
      verbs: ["get"]
clusterDNS:
  rules:
    - apiGroups: [""]
      resources: ["services"]
      verbs: ["get", "list"]
core:
  rules:
    - apiGroups: ["karpenter.sh"]
      resources: ["nodepools", "nodepools/status", "nodeclaims", "nodeclaims/status", "nodeoverlays", "nodeoverlays/status"]
      verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
    - apiGroups: ["autoscaling.x-k8s.io"]
      resources: ["capacitybuffers", "capacitybuffers/status"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["pods", "persistentvolumes", "persistentvolumeclaims", "replicationcontrollers", "namespaces", "podtemplates", "events", "services"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["events"]
      verbs: ["create", "patch"]
    - apiGroups: [""]
      resources: ["pods"]
      verbs: ["delete"]
    - apiGroups: [""]
      resources: ["pods/eviction"]
      verbs: ["create"]
    # Core reads, updates and deletes the Nodes it manages; the kubelets create them.
    - apiGroups: [""]
      resources: ["nodes"]
      verbs: ["get", "list", "watch", "patch", "update", "delete"]
    - apiGroups: ["storage.k8s.io"]
      resources: ["storageclasses", "csinodes", "volumeattachments"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["apps"]
      resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["policy"]
      resources: ["poddisruptionbudgets"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["apiextensions.k8s.io"]
      resources: ["customresourcedefinitions"]
      verbs: ["get", "list", "watch"]
    # Core's cache watches the node heartbeat leases of kube-node-lease (a
    # cluster-wide list and watch with a field selector).
    - apiGroups: ["coordination.k8s.io"]
      resources: ["leases"]
      verbs: ["get", "list", "watch"]
leaderElection:
  rules:
    - apiGroups: ["coordination.k8s.io"]
      resources: ["leases"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
nodeJoin:
  - name: scarpenter-node-bootstrapper
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: "system:node-bootstrapper"
    subjects:
      - {apiGroup: rbac.authorization.k8s.io, kind: Group, name: "system:bootstrappers:scarpenter"}
  - name: scarpenter-auto-approve-node-client-csrs
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: "system:certificates.k8s.io:certificatesigningrequests:nodeclient"
    subjects:
      - {apiGroup: rbac.authorization.k8s.io, kind: Group, name: "system:bootstrappers:scarpenter"}
  - name: scarpenter-auto-approve-node-client-renewals
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: "system:certificates.k8s.io:certificatesigningrequests:selfnodeclient"
    subjects:
      - {apiGroup: rbac.authorization.k8s.io, kind: Group, name: "system:nodes"}
