apiVersion: v2
name: scarpenter-crd
description: >-
  The CRDs of SCarpenter (SCNodeClass and, optionally, Karpenter core's NodePool
  and NodeClaim) as templates, so that helm upgrade updates them. Install or
  upgrade this chart before the scarpenter chart.
type: application
# The release workflow packages it with the version of the Git tag, like the
# scarpenter chart: the two versions always match.
version: 0.0.0-dev
appVersion: dev
kubeVersion: ">=1.31.0-0"
home: https://github.com/SpareCores/scarpenter
sources:
  - https://github.com/SpareCores/scarpenter
maintainers:
  - name: Spare Cores
    url: https://sparecores.com
annotations:
  artifacthub.io/license: MPL-2.0
