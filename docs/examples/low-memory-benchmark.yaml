# A NodeClass for single-purpose benchmark ("inspector") nodes on small instance types, down
# to 1 GiB of memory: footprint Lean keeps the node's own memory use low and reserves little
# (docs/reference/node-settings.md#memory-footprint). The matching NodePool, with the taint,
# the small sizes and a Pod per node, is nodepools/low-memory-benchmark.yaml.
#
# Lean sets maxPods 10, kubeReserved and systemReserved memory and an evictionHard
# memory.available that scale with the node's memory (192Mi, 128Mi and 50Mi on 1 GiB;
# 144Mi, 96Mi and 16Mi on 0.5 GiB), and the node's own limits (no swap or zram, so a
# benchmark's memory is the node's). A field set under kubelet overrides it: here maxPods
# is raised to 12 for a node that also runs one more DaemonSet.
apiVersion: scarpenter.sparecores.com/v1alpha1
kind: SCNodeClass
metadata:
  name: low-memory-benchmark
spec:
  flatcar:
    version: "4757.2.3"
  kubernetes:
    version: "v1.37.1"
  network:
    template: direct
  kubelet:
    footprint: Lean
    maxPods: 12
  vendors:
    aws:
      regions: [us-east-1, eu-central-1]
